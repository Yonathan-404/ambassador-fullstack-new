<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller Portal · Ambassador Shopping Mall</title>
<meta name="theme-color" content="#8a1450">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seller Portal">
<link rel="manifest" href="/seller-manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{--wine:#8a1450;--wine-d:#5e1338;--wine-deep:#420d27;--gold:#D4AF37;--gold-d:#b8941f;--gold-deep:#8a6d12;
        --accent:#9c2f63;--teal:#9c2f63;--ink:#221820;--mid:#7d6e76;--line:#efe6ea;--bg:#faf6f8;--wa:#25D366}
  *{box-sizing:border-box}
  body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0}

  /* ── top bar — the seller's own shop identity front and center ── */
  .top{background:linear-gradient(135deg,var(--wine),var(--wine-deep));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
       border-bottom:2px solid var(--gold);box-shadow:0 6px 20px -10px rgba(66,13,39,.7)}
  .top .logos{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .top .logos img{height:34px;width:34px;object-fit:contain;border-radius:8px;background:#fff;padding:2px}
  .shopav{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;
    font-size:.86rem;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.5);background-size:cover;background-position:center}
  .top .idbox{min-width:0}
  .top h1{font-size:1.02rem;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;line-height:1.3}
  .top .shop{font-size:.72rem;opacity:.85;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .spacer{flex:1;min-width:6px}
  .brandbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 20px;background:#fff;
            border-bottom:1px solid var(--line);font-size:.7rem;color:var(--mid);letter-spacing:.4px}
  .brandbar img{height:18px;width:auto;border-radius:4px}
  .brandbar b{color:var(--wine)}
  .instbtn{background:linear-gradient(135deg,var(--gold-d),var(--gold-deep))!important}
  .top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-size:.8rem;white-space:nowrap}

  /* ── sidebar shell — same skeleton as the BMS/Admin consoles, tuned for the seller portal ── */
  .shell{display:flex;align-items:flex-start;min-height:calc(100vh - 106px)}
  .side{width:222px;flex-shrink:0;background:#fff;border-right:1px solid #ece3e7;padding:14px 10px 30px;
    position:sticky;top:0;max-height:100vh;overflow-y:auto}
  .navgrp{font-size:.63rem;text-transform:uppercase;letter-spacing:1px;color:#a3939c;font-weight:800;padding:14px 12px 6px}
  .nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;
    color:#4a3a44;font-size:.86rem;font-weight:600;text-decoration:none;transition:.15s;margin-bottom:2px}
  .nav i{width:17px;text-align:center;color:#b09aa6;font-size:.9rem}
  .nav:hover{background:#faf3f7;color:var(--wine)}
  .nav:hover i{color:var(--wine)}
  .nav.on{background:linear-gradient(100deg,var(--wine),var(--wine-d));color:#fff;box-shadow:0 6px 16px -8px rgba(138,20,80,.7)}
  .nav.on i{color:var(--gold)}
  .nav .badge{margin-left:auto;background:#f0e3ea;color:var(--wine);border-radius:99px;padding:1px 8px;font-size:.66rem;font-weight:800;display:none}
  .nav .badge.show{display:inline-block}
  .nav.on .badge{background:rgba(255,255,255,.25);color:#fff}
  .main{flex:1;min-width:0}
  .crumb{padding:12px 22px 0;font-size:.72rem;text-transform:uppercase;letter-spacing:1.2px;color:#a3939c;font-weight:800}
  .navtoggle{display:none;position:fixed;left:12px;bottom:16px;z-index:60;width:50px;height:50px;border-radius:50%;
    background:var(--wine);color:#fff;border:none;font-size:1.15rem;box-shadow:0 8px 22px -6px rgba(66,13,39,.65);cursor:pointer}
  .scrim{display:none;position:fixed;inset:0;background:rgba(40,8,24,.45);z-index:40}
  @media(max-width:900px){
    .side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .28s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
    body.navopen .side{transform:none}
    body.navopen .scrim{display:block}
    .navtoggle{display:flex;align-items:center;justify-content:center}
    .crumb{padding-left:16px}
  }

  .wrap{max-width:1000px;margin:0 auto;padding:18px 20px 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;font-size:.86rem}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .ref{font-family:ui-monospace,monospace;font-weight:700;color:var(--wine)}
  .muted{color:var(--mid);font-size:.78rem}
  .tot{font-weight:800;color:var(--wine);font-size:1rem}
  .pill{border-radius:99px;padding:3px 11px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .pill.placed{background:#eee;color:#666}.pill.confirmed{background:#e6f4ff;color:#1769aa}
  .pill.preparing{background:#fff7e0;color:#9a6b00}.pill.out_for_delivery{background:#efe9ff;color:#6b3fd1}
  .pill.delivered{background:#e9f8ee;color:#1d9e54}.pill.cancelled{background:#fdeaf0;color:#c2185b}
  select,input{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:.85rem;background:#fff}
  
  .btn{background:linear-gradient(135deg,var(--gold-d),var(--gold-deep));color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.82rem}
  .btn.wine{background:linear-gradient(135deg,var(--wine),var(--wine-d))}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5}
  .login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
  .login .logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--wine),#b03d77);color:#fff;font-size:1.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .login h2{margin:0 0 4px;font-size:1.25rem}
  .login p{color:var(--mid);font-size:.82rem;margin:0 0 18px}
  .login input{width:100%;margin-bottom:10px}
  .login .btn{width:100%;padding:12px}
  .err{color:#c2185b;font-size:.8rem;min-height:18px;margin-top:8px}
  .items{color:var(--mid);font-size:.78rem;line-height:1.6;margin:6px 0}
  .buyer{background:var(--bg);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:.8rem}
  .empty{text-align:center;color:#aaa;padding:48px 10px}

  /* ── order cards — a coloured left rail echoes the status pill ── */
  .ocard{border-left:4px solid #ccc}
  .ocard.placed{border-left-color:#999}
  .ocard.confirmed{border-left-color:#1769aa}
  .ocard.preparing{border-left-color:#b8941f}
  .ocard.out_for_delivery{border-left-color:#6b3fd1}
  .ocard.delivered{border-left-color:#1d9e54}
  .ocard.cancelled{border-left-color:#c2185b}

  /* ── product cards — a real card grid instead of a plain data row ── */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px;align-items:start}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 2px 10px -6px rgba(66,13,39,.15);transition:.2s;display:flex;flex-direction:column}
  .pcard:hover{transform:translateY(-3px);box-shadow:0 14px 26px -10px rgba(66,13,39,.28);border-color:transparent}
  .pcard.is-off{opacity:.6}
  .pcard-img{height:132px;position:relative;background:var(--bg);overflow:hidden}
  .pcard-img img{width:100%;height:100%;object-fit:cover;display:block}
  .pcard-img .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.9rem}
  .pcard-badges{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap}
  .pcard-badges .pill{padding:2px 9px;font-size:.6rem;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .pcard-body{padding:12px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
  .pcard-name{font-weight:700;font-size:.88rem;line-height:1.3}
  .pcard-cat{font-size:.7rem;color:var(--mid);margin-top:1px}
  .pcard-price{font-weight:800;color:var(--wine);font-size:.94rem}
  .pcard-price .old{font-weight:600;color:#aaa;text-decoration:line-through;font-size:.76rem;margin-left:5px}
  .pcard-editrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pcard-editrow input{width:68px;padding:8px 7px;flex-shrink:0}
  .pcard-editrow select{flex:1;min-width:78px;padding:8px 4px}
  .pcard-editrow .btn{flex-shrink:0}
  .pcard-acts{display:flex;gap:6px;margin-top:auto;padding-top:2px}
  .iconbtn{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--mid);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.82rem;transition:.15s;flex-shrink:0}
  .iconbtn:hover{border-color:var(--wine);color:var(--wine);background:#faf3f7}
  .iconbtn.danger:hover{border-color:#c2185b;color:#c2185b;background:#fdeef2}
  .iconbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .pcard-detail{border:1px dashed #d7c4cd;background:#faf6f8;border-radius:11px;padding:12px;margin-top:2px}

  /* ── dashboard ── */
  .dash-hero{background:linear-gradient(135deg,var(--wine),var(--wine-d));color:#fff;border-radius:18px;padding:22px 24px;
    margin-bottom:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden}
  .dash-hero::after{content:'';position:absolute;top:-40px;right:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
  .av{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:800;flex-shrink:0;background-size:cover;background-position:center;color:#fff}
  .dash-hero h2{margin:0 0 3px;font-size:1.22rem}
  .dash-hero p{margin:0;opacity:.85;font-size:.83rem}
  .dash-score{margin-left:auto;text-align:center;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 20px;min-width:110px}
  .dash-score .n{font-size:1.5rem;font-weight:800}
  .dash-score .l{font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;opacity:.9}
  .attn{border-left:4px solid var(--gold-d)}
  .attn-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.83rem}
  .attn-row:last-child{border-bottom:0}
  .attn-row i{width:20px;text-align:center;color:var(--gold-d);font-size:1rem}
  .attn-row .go{margin-left:auto;font-size:.76rem;font-weight:700;color:var(--wine);cursor:pointer;white-space:nowrap}
  .attn-ok{display:flex;align-items:center;gap:10px;color:#1d7a33;font-weight:700;padding:6px 0}
  .mini-order{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.82rem}
  .mini-order:last-child{border-bottom:0}
  .dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
  @media(max-width:760px){.dash-grid{grid-template-columns:1fr}}
  .dash-link{color:var(--wine);font-weight:700;font-size:.8rem;cursor:pointer}

  /* ── shop preview — a live mini-card so sellers see what buyers see ── */
  .shopprev{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 20px -12px rgba(0,0,0,.25);width:220px;flex-shrink:0}
  .shopprev-cover{height:56px}
  .shopprev-body{padding:13px;margin-top:-24px}
  .shopprev-av{width:48px;height:48px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:1rem;background-size:cover;background-position:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .shopprev-name{font-weight:700;font-size:.88rem;margin-top:8px}
  .shopprev-cat{font-size:.68rem;color:var(--wine);font-weight:700;margin:2px 0 6px}
  .shopprev-blurb{font-size:.74rem;color:var(--mid);line-height:1.5;max-height:3.2em;overflow:hidden}

.acctwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-top:8px}
  .acct{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.84rem}
  .tag{background:#eee;border-radius:99px;padding:2px 9px;font-size:.7rem;font-weight:700}
  .tag.ok{background:#e6f4ea;color:#1d7a33}
  .tag.no{background:#fdeaea;color:#b3261e}
  .swwrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
  .swgroup{display:flex;flex-direction:column;gap:4px}
  .swlabel{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mid);font-weight:700}
  .swrow{display:flex;gap:5px}
  .sw{width:28px;height:28px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:.15s}
  .sw:hover{transform:scale(1.12)}
  .sw.on{box-shadow:0 0 0 2px var(--wine);transform:scale(1.12)}
  .swprev{width:32px;height:32px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:inline-block;flex-shrink:0}
  .logoprev{width:74px;height:74px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);
    background:var(--wine);background-size:cover;background-position:center;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;flex-shrink:0}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .stat .n{font-size:1.5rem;font-weight:800;color:var(--wine);line-height:1.1}
  .stat .l{font-size:.68rem;color:var(--mid);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:2px}
  .savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px;display:none;text-align:right}
  /* shop profile tab */
  textarea.desc{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.86rem;resize:vertical;min-height:80px}
  textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.86rem;resize:vertical;background:#fff;color:var(--ink);box-sizing:border-box}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
  .grid input{width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.22)}
  .charct{text-align:right;font-size:.72rem;color:var(--mid);margin-top:4px}
  .soc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .soc-row:last-child{border-bottom:0}
  .soc-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;flex-shrink:0}
  .soc-ic.instagram{background:linear-gradient(45deg,#FFDC80,#FCAF45,#F56040,#C13584)}
  .soc-ic.facebook{background:#4267B2}.soc-ic.tiktok{background:#010101}
  .soc-ic.telegram{background:#229ED9}.soc-ic.youtube{background:#FF0000}.soc-ic.website{background:#7d6e76}
  .soc-row input{flex:1;min-width:0}
  .toggle{position:relative;width:42px;height:24px;flex-shrink:0}
  .toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .toggle .track{position:absolute;inset:0;background:#ddd;border-radius:99px;transition:.2s}
  .toggle .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .toggle input:checked ~ .track{background:var(--teal)}
  .toggle input:checked ~ .track .knob{transform:translateX(18px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => (''+(s==null?'':s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => 'ETB ' + Number(n||0).toLocaleString();   // used by the My Rent tab
const STATUS_LABEL = {placed:'Placed', confirmed:'Payment confirmed', preparing:'Preparing', out_for_delivery:'Out for delivery', delivered:'Delivered', cancelled:'Cancelled'};
const PENDING_STATUSES = ['placed','confirmed','preparing'];
const TAB_TITLES = {dashboard:'Dashboard', orders:'Orders', stock:'Products', profile:'Shop Profile', rent:'My Rent', jobs:'Vacancies'};
let me = null, tab = 'dashboard';
let myFull = null;       // this seller's own tenant record (color, logo, blurb, products…), refreshed every render()
let myOrders = [];        // this seller's own orders, refreshed every render()
let orderStatuses = [];   // valid order-status values, from the same fetch as myOrders

async function api(path, opts){
  const o = opts||{};
  const r = await fetch(path, { method:o.method||'GET',
    headers:o.body?{'Content-Type':'application/json'}:undefined,
    body:o.body?JSON.stringify(o.body):undefined, credentials:'same-origin' });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}

function loginView(msg){
  $('#app').innerHTML = `
  <div class="login">
    <div class="logo">A</div>
    <h2>Seller Portal</h2>
    <p>Ambassador Shopping Mall · sign in with the phone and access code given to you by Bisinka Marketplace.</p>
    <input id="ph" type="tel" placeholder="Phone (09xx xxx xxx)">
    <input id="code" type="password" placeholder="Access code" inputmode="numeric">
    <button class="btn wine" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> Sign in</button>
    <div class="err" id="err">${esc(msg||'')}</div>
  </div>`;
}
async function doLogin(){
  try{
    const d = await api('/api/seller/login', {method:'POST', body:{phone:$('#ph').value, code:$('#code').value}});
    me = d.tenant; render();
  }catch(e){ $('#err').textContent = e.message; }
}
async function doLogout(){ await api('/api/seller/logout',{method:'POST',body:{}}).catch(()=>{}); me=null; loginView(); }

/* shop-colour avatar — used in the top bar and again (bigger) on the dashboard hero */
function avatarHTML(cls){
  const t = myFull || {};
  const color = t.color || '#8a1450';
  const initials = (me.name||'').split(' ').slice(0,2).map(w=>w.charAt(0)).join('').toUpperCase();
  if(t.logo) return `<span class="${cls}" style="background-image:url('${esc(t.logo)}');border-color:${esc(color)}"></span>`;
  return `<span class="${cls}" style="background:${esc(color)}">${esc(initials)}</span>`;
}
function updateNavBadge(){
  const b = document.getElementById('navOrdersBadge'); if(!b) return;
  const n = myOrders.filter(o=>PENDING_STATUSES.indexOf(o.status)>=0).length;
  b.textContent = n||''; b.classList.toggle('show', n>0);
}
function closeNav(){ document.body.classList.remove('navopen'); }

function shell(inner){
  $('#app').innerHTML = `
  <div class="top">
    <span class="logos">
      <img src="/media/ambassador-logo.png" alt="Ambassador Shopping Mall">
      <img src="/media/bisinka-logo.png" alt="Bisinka">
    </span>
    <span id="hdrAvatar">${avatarHTML('shopav')}</span>
    <div class="idbox">
      <h1>${esc(me.name)}</h1>
      <span class="shop">${esc(me.floor||'')}${me.cat?' · '+esc(me.cat):''}</span>
    </div>
    <span class="spacer"></span>
    <button id="sellerInstall" style="display:none" class="instbtn" onclick="installApp()"><i class="fas fa-mobile-screen-button"></i> Install</button>
    <button onclick="doLogout()"><i class="fas fa-right-from-bracket"></i> Sign out</button>
  </div>
  <div class="brandbar"><img src="/media/bisinka-logo.png" alt=""> Ambassador Shopping Mall seller portal &mdash; powered by <b>Bisinka</b></div>
  <button class="navtoggle" onclick="document.body.classList.toggle('navopen')" aria-label="Menu"><i class="fas fa-bars"></i></button>
  <div class="shell">
    <aside class="side">
      <div class="navgrp">Overview</div>
      <a class="nav ${tab==='dashboard'?'on':''}" onclick="tab='dashboard';closeNav();render()"><i class="fas fa-gauge"></i><span>Dashboard</span></a>
      <a class="nav ${tab==='orders'?'on':''}" onclick="tab='orders';closeNav();render()"><i class="fas fa-receipt"></i><span>Orders</span><b class="badge" id="navOrdersBadge"></b></a>
      <div class="navgrp">Shop</div>

}

/* ── product card — used by the Products tab's card grid ── */
function pcardHTML(p, color){
  const off = p.old ? Math.round((1-p.price/p.old)*100) : 0;
  const state = (p.stock&&p.stock.state)||'in';
  const stockCls = state==='out'?'cancelled':(state==='low'?'preparing':(state==='made'?'confirmed':'delivered'));
  const stockLabel = {in:'In stock',low:'Low stock',made:'Made to order',out:'Sold out'}[state];
  const thumb = p.img
    ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="ph" style="display:none;background:${esc(color)}"><i class="fas fa-box"></i></div>`
    : `<div class="ph" style="background:${esc(color)}"><i class="fas fa-box"></i></div>`;
  return `<div class="pcard${p.active===false?' is-off':''}">
    <div class="pcard-img">
      ${thumb}
      <div class="pcard-badges">
        <span class="pill ${stockCls}">${esc(stockLabel)}</span>
        ${p.active===false?'<span class="pill cancelled">OFF</span>':''}
      </div>
    </div>
    <div class="pcard-body">
      <div>
        <div class="pcard-name">${esc(p.name)}</div>
        <div class="pcard-cat">${esc(p.cat||'')}</div>
      </div>
      <div class="pcard-price">${fmt(p.price)}${p.old?`<span class="old">${fmt(p.old)}</span>`:''}${off?` <span class="muted">(-${off}%)</span>`:''}</div>
      <div class="pcard-editrow">
        <input type="number" id="pr-${esc(p.id)}" value="${p.price}" min="1">
        <select id="sk-${esc(p.id)}">
          <option value="in" ${state==='in'?'selected':''}>In stock</option>
          <option value="low" ${state==='low'?'selected':''}>Low (few left)</option>
          <option value="made" ${state==='made'?'selected':''}>Made to order</option>
          <option value="out" ${state==='out'?'selected':''}>Sold out</option>
        </select>
        <button class="btn" style="padding:8px 11px" onclick="saveProd('${esc(p.id)}')">Save</button>
      </div>
      <div class="pcard-acts">
        <span class="iconbtn" title="Photos" onclick="editPhotos('${esc(p.id)}')"><i class="fas fa-image"></i></span>
        <span class="iconbtn" title="Edit details" onclick="editProd('${esc(p.id)}')"><i class="fas fa-pen"></i></span>
        <span class="iconbtn ${p.active===false?'on':''}" title="${p.active===false?'Turn ON':'Turn OFF'}" onclick="toggleActive('${esc(p.id)}',${p.active===false})"><i class="fas ${p.active===false?'fa-toggle-off':'fa-toggle-on'}"></i></span>
        <span class="iconbtn danger" title="Delete" onclick="removeProd('${esc(p.id)}')"><i class="fas fa-trash"></i></span>
      </div>
      <div id="pe-${esc(p.id)}"></div>
      <div id="ph-${esc(p.id)}"></div>
    </div>
  </div>`;
}

          <div class="soc-row" style="border-bottom:0;padding:2px 0">
            <span class="soc-ic" style="background:var(--wine)"><i class="fas fa-calendar-check"></i></span>
            <div style="flex:1;min-width:0">
              <b>Accept appointment bookings</b>
              <div class="muted">Shows a “Book Appointment” button on your shop page. Requests arrive on your WhatsApp with the date and time already filled in.</div>
            </div>
            <label class="toggle" title="Accept bookings">
              <input type="checkbox" id="pf-appt" ${t.appointments?'checked':''}>
              <span class="track"><span class="knob"></span></span>
            </label>
          </div>
        </div>
        <div style="text-align:right"><button class="btn wine" onclick="saveProfile()"><i class="fas fa-check"></i> Save shop profile</button></div>
        <div class="card" style="margin-top:16px">
          <b><i class="fas fa-key"></i> Change your access code</b>
          <div class="muted" style="margin:4px 0 10px">Only you know this code — it is stored encrypted, so nobody can read it back to you. If you forget it, ask mall management to issue a new one.</div>
          <div class="grid">
            <input id="pw-cur" type="password" placeholder="Current access code" autocomplete="current-password">
            <input id="pw-new" type="password" placeholder="New code (min 6 characters)" autocomplete="new-password">
            <input id="pw-rep" type="password" placeholder="Repeat new code" autocomplete="new-password">
          </div>
          <div class="err" id="pw-err" style="min-height:18px"></div>
          <div style="text-align:right"><button class="btn" onclick="changeCode()"><i class="fas fa-shield-halved"></i> Update access code</button></div>
        </div>`;
    }
  }catch(e){
    if((''+e.message).match(/sign in/i)){ me=null; loginView('Session expired — please sign in again.'); return; }
    $('#body').innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>';
  }
}

/* installable seller portal */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e;
  const b=document.getElementById('sellerInstall'); if(b) b.style.display='inline-flex'; });
function installApp(){
  if(!deferredInstall){
    alert(/iPad|iPhone|iPod/.test(navigator.userAgent)
      ? 'To install: tap Share, then "Add to Home Screen".'
      : 'Use your browser menu, then "Install app".');
    return;
  }
  deferredInstall.prompt();
  deferredInstall.userChoice.then(()=>{ deferredInstall=null;
    const b=document.getElementById('sellerInstall'); if(b) b.style.display='none'; });
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}

async function changeCode(){
  const cur=document.getElementById('pw-cur').value.trim();
  const nw =document.getElementById('pw-new').value.trim();
  const rp =document.getElementById('pw-rep').value.trim();
  const err=document.getElementById('pw-err');
  err.style.color=''; err.textContent='';
  if(!cur||!nw){ err.textContent='Enter your current code and a new one.'; return; }
  if(nw!==rp){ err.textContent='The two new codes do not match.'; return; }
  if(nw.length<6){ err.textContent='New code must be at least 6 characters.'; return; }
  try{
    await api('/api/seller/change-code',{method:'POST',body:{current:cur,next:nw}});
    err.style.color='#1d7a33';
    err.textContent='Access code updated. Use the new code next time you sign in.';
    ['pw-cur','pw-new','pw-rep'].forEach(id=>document.getElementById(id).value='');
  }catch(e){ err.textContent=e.message; }
}

/* ── shop card colour palette (same set the admin console offers) ── */
const SHOP_COLORS = [
  ['Wine',['#8A1450','#A83269','#5E1338','#C25B86','#7A1A44']],
  ['Gold & Bronze',['#B8941F','#D4AF37','#8A6D12','#96601F','#7A4A1E','#C6941B']],
  ['Plum & Rose',['#9C2F63','#C13584','#D4468F','#E0579C','#A82B70']],
  ['Earth',['#B5651D','#A85C1A','#C7702A','#5B4636','#4A3A2C','#A8641C']],
  ['Blue',['#1E3A8A','#2451A8','#1E56C0','#3D5A80','#2E4560']],
  ['Deep & Neutral',['#1F2937','#374151','#0F5132','#134E4A','#4C1D95']]
];
function swatchHTML(cur){
  const c0=(cur||'#8A1450').toUpperCase();
  return SHOP_COLORS.map(([label,cols])=>`
    <div class="swgroup"><span class="swlabel">${label}</span>
      <div class="swrow">${cols.map(c=>`
        <button type="button" class="sw${c.toUpperCase()===c0?' on':''}" style="background:${c}"
          title="${c}" onclick="pickColor('${c}')"></button>`).join('')}</div>
    </div>`).join('');
}
function pickColor(hex){
  window.__shopColor=hex;
  const sw=document.getElementById('pf-sw'); if(sw) sw.innerHTML=swatchHTML(hex);
  const pv=document.getElementById('pf-colorprev'); if(pv) pv.style.background=hex;
  refreshShopPreview();
}
function uploadShopLogo(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{
    const S=256,c=document.createElement('canvas'); c.width=c.height=S;
    const ctx=c.getContext('2d'), m=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
    window.__shopLogo=c.toDataURL('image/jpeg',0.85);
    const p=document.getElementById('pf-logoprev');
    if(p){ p.style.backgroundImage='url('+window.__shopLogo+')'; p.textContent=''; }
    refreshShopPreview();
  }; img.src=rd.result; };
  rd.readAsDataURL(f);
}
/* ── live "how buyers see your shop" preview card ── */
function shopPreviewHTML(t){
  t = t || {};
  const color = window.__shopColor || t.color || '#8a1450';
  const logo = (window.__shopLogo!==undefined ? window.__shopLogo : t.logo) || '';
  const blurbEl = document.getElementById('pf-blurb');
  const blurb = blurbEl ? blurbEl.value : (t.blurb||'');
  const initials = (t.name||me.name||'').split(' ').slice(0,2).map(w=>w.charAt(0)).join('').toUpperCase();
  return `
    <div class="shopprev-cover" style="background:linear-gradient(135deg,${esc(color)},${esc(color)}cc)"></div>
    <div class="shopprev-body">
      <div class="shopprev-av" style="background:${esc(color)};${logo?`background-image:url('${esc(logo)}')`:''}">${logo?'':esc(initials)}</div>
      <div class="shopprev-name">${esc(t.name||me.name||'')}</div>
      <div class="shopprev-cat">${esc(t.cat||me.cat||'')}${(t.floor||me.floor)?' · '+esc(t.floor||me.floor):''}</div>
      <div class="shopprev-blurb">${esc(blurb||'No description yet.')}</div>
    </div>`;
}
function refreshShopPreview(){
  const el = document.getElementById('shopPreview');
  if(el) el.innerHTML = shopPreviewHTML(myFull||{});
}
async function raiseTicket(){
  const title=document.getElementById('tkTitle').value.trim();
  if(!title) return alert('Please describe the problem.');
  try{
    await api('/api/seller/ticket',{method:'POST',body:{title,
      cat:document.getElementById('tkCat').value, pri:document.getElementById('tkPri').value}});
    render();
  }catch(e){ alert(e.message); }
}
async function saveProfile(){
  const blurb = document.getElementById('pf-blurb').value.trim();
  const socials = {};
  Object.keys(window.__soc||{}).forEach(k=>{ socials[k] = window.__soc[k]; });
  try{
    const appointments = !!document.getElementById('pf-appt').checked;
    const gallery=[];
    for(let i=0;i<5;i++){ const v=window.__img && window.__img['shop-'+i]; if(v) gallery.push(v); }
    const body = {blurb, socials, appointments, gallery};
    if(window.__shopColor) body.color = window.__shopColor;
    if(window.__shopLogo)  body.logo  = window.__shopLogo;   // omit unless changed
    await api('/api/seller/profile',{method:'POST',body});
    render();
  }catch(e){ alert(e.message); }
}
/* ── product photos: up to 3, uploaded as compressed data-URLs ── */
window.__img = {};
function editPhotos(pid){
  const p=(window.__prods||[]).find(x=>x.id===pid); if(!p) return;
  const box=document.getElementById('ph-'+pid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const gal=(p.gallery&&p.gallery.length?p.gallery:[p.img]).filter(Boolean);
  let slots='';
  for(let i=0;i<3;i++){
    const key=pid+'-'+i, cur=gal[i]||'';
    window.__img[key]=cur;
    slots+=`<div style="width:96px">
      <div id="th-${key}" onclick="pickImg('${key}')" style="width:96px;height:72px;border:1.5px ${cur?'solid #8a1450':'dashed #cbb'};border-radius:9px;background:#fff center/cover no-repeat ${cur?`url('${cur}')`:''};display:flex;align-items:center;justify-content:center;color:#bba;font-size:1.1rem;cursor:pointer">${cur?'':'+'}</div>
      <button onclick="clearImg('${key}')" style="display:block;width:100%;margin-top:4px;background:#eee;color:#a55;font-size:.62rem;padding:3px 0;border:0;border-radius:6px;cursor:pointer">clear</button>
    </div>`;
  }
  box.innerHTML=`<div class="pcard-detail">
    <div class="muted" style="margin-bottom:8px"><b><i class="fas fa-image"></i> Product photos (up to 3)</b> — the first is the main image. Tap a box to upload; photos are compressed automatically.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${slots}</div>
    <div style="margin-top:10px;text-align:right"><button class="btn" onclick="savePhotos('${pid}')">Save photos</button></div>
  </div>`;
}
function pickImg(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const mx=900, sc=Math.min(1, mx/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        const url=cv.toDataURL('image/jpeg',.82);
        window.__img[key]=url;
        const th=document.getElementById('th-'+key);
        th.style.border='1.5px solid #8a1450';
        th.style.background=`#fff center/cover no-repeat url('${url}')`;
        th.textContent='';
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function clearImg(key){
  window.__img[key]='';
  const th=document.getElementById('th-'+key);
  if(th){ th.style.border='1.5px dashed #cbb'; th.style.background='#fff'; th.textContent='+'; }
}
async function savePhotos(pid){
  const gallery=[];
  for(let i=0;i<3;i++){ const v=window.__img[pid+'-'+i]; if(v) gallery.push(v); }
  if(!gallery.length){ alert('Add at least one photo, or close the editor.'); return; }
  try{
    await api('/api/seller/product',{method:'POST',body:{pid, gallery}});
    render();
  }catch(e){ alert(e.message); }
}
/* boot: restore session if cookie valid */
api('/api/seller/me').then(d=>{ me=d.tenant; render(); }).catch(()=>loginView());
