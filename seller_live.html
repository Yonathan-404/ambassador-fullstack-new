<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller Portal · Ambassador Shopping Mall</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{--wine:#8a1450;--teal:#0D7A6F;--ink:#221820;--mid:#7d6e76;--line:#e8e2e5;--bg:#f8f5f6}
  *{box-sizing:border-box}
  body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0}
  .top{background:linear-gradient(135deg,var(--wine),#5e0e38);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .top h1{font-size:1.05rem;margin:0;flex:1}
  .top .shop{font-size:.8rem;opacity:.85}
  .top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-size:.8rem}
  .wrap{max-width:860px;margin:0 auto;padding:18px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{flex:1;padding:11px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--mid)}
  .tabs button.on{border-color:var(--wine);color:var(--wine);background:#faf2f6}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;font-size:.86rem}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .ref{font-family:ui-monospace,monospace;font-weight:700;color:var(--wine)}
  .muted{color:var(--mid);font-size:.78rem}
  .tot{font-weight:800;color:var(--wine);font-size:1rem}
  .pill{border-radius:99px;padding:3px 11px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .pill.placed{background:#eee;color:#666}.pill.confirmed{background:#e6f4ff;color:#1769aa}
  .pill.preparing{background:#fff7e0;color:#9a6b00}.pill.out_for_delivery{background:#efe9ff;color:#6b3fd1}
  .pill.delivered{background:#e9f8ee;color:#1d9e54}.pill.cancelled{background:#fdeaf0;color:#c2185b}
  select,input{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:.85rem;background:#fff}
  .btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.82rem}
  .btn.wine{background:var(--wine)}
  .btn:disabled{opacity:.5}
  .login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
  .login .logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--wine),#b03d77);color:#fff;font-size:1.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .login h2{margin:0 0 4px;font-size:1.25rem}
  .login p{color:var(--mid);font-size:.82rem;margin:0 0 18px}
  .login input{width:100%;margin-bottom:10px}
  .login .btn{width:100%;padding:12px}
  .err{color:#c2185b;font-size:.8rem;min-height:18px;margin-top:8px}
  .items{color:var(--mid);font-size:.78rem;line-height:1.6;margin:6px 0}
  .buyer{background:var(--bg);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:.8rem}
  .empty{text-align:center;color:#aaa;padding:48px 10px}
  .prod{display:grid;grid-template-columns:1fr 100px 140px 60px 90px;gap:8px;align-items:center}
  .prod.is-off{opacity:.55;background:#fafafa}
  @media(max-width:640px){.prod{grid-template-columns:1fr 1fr}}
  .savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px;display:none;text-align:right}
  /* shop profile tab */
  textarea.desc{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.86rem;resize:vertical;min-height:80px}
  .charct{text-align:right;font-size:.72rem;color:var(--mid);margin-top:4px}
  .soc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .soc-row:last-child{border-bottom:0}
  .soc-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;flex-shrink:0}
  .soc-ic.instagram{background:linear-gradient(45deg,#FFDC80,#FCAF45,#F56040,#C13584)}
  .soc-ic.facebook{background:#4267B2}.soc-ic.tiktok{background:#010101}
  .soc-ic.telegram{background:#229ED9}.soc-ic.youtube{background:#FF0000}.soc-ic.website{background:#7d6e76}
  .soc-row input{flex:1;min-width:0}
  .toggle{position:relative;width:42px;height:24px;flex-shrink:0}
  .toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .toggle .track{position:absolute;inset:0;background:#ddd;border-radius:99px;transition:.2s}
  .toggle .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .toggle input:checked ~ .track{background:var(--teal)}
  .toggle input:checked ~ .track .knob{transform:translateX(18px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => (''+(s==null?'':s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATUS_LABEL = {placed:'Placed', confirmed:'Payment confirmed', preparing:'Preparing', out_for_delivery:'Out for delivery', delivered:'Delivered', cancelled:'Cancelled'};
let me = null, tab = 'orders';

async function api(path, opts){
  const o = opts||{};
  const r = await fetch(path, { method:o.method||'GET',
    headers:o.body?{'Content-Type':'application/json'}:undefined,
    body:o.body?JSON.stringify(o.body):undefined, credentials:'same-origin' });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}

function loginView(msg){
  $('#app').innerHTML = `
  <div class="login">
    <div class="logo">A</div>
    <h2>Seller Portal</h2>
    <p>Ambassador Shopping Mall · sign in with the phone and access code given to you by Bisinka Marketplace.</p>
    <input id="ph" type="tel" placeholder="Phone (09xx xxx xxx)">
    <input id="code" type="password" placeholder="Access code" inputmode="numeric">
    <button class="btn wine" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> Sign in</button>
    <div class="err" id="err">${esc(msg||'')}</div>
  </div>`;
}
async function doLogin(){
  try{
    const d = await api('/api/seller/login', {method:'POST', body:{phone:$('#ph').value, code:$('#code').value}});
    me = d.tenant; render();
  }catch(e){ $('#err').textContent = e.message; }
}
async function doLogout(){ await api('/api/seller/logout',{method:'POST',body:{}}).catch(()=>{}); me=null; loginView(); }

function shell(inner){
  $('#app').innerHTML = `
  <div class="top"><h1><i class="fas fa-store"></i> ${esc(me.name)}</h1>
    <span class="shop">${esc(me.floor)} · Seller Portal</span>
    <button onclick="doLogout()"><i class="fas fa-right-from-bracket"></i> Sign out</button></div>
  <div class="wrap">
    <div class="tabs">
      <button class="${tab==='orders'?'on':''}" onclick="tab='orders';render()"><i class="fas fa-receipt"></i> Orders</button>
      <button class="${tab==='stock'?'on':''}" onclick="tab='stock';render()"><i class="fas fa-boxes-stacked"></i> Stock & Prices</button>
      <button class="${tab==='profile'?'on':''}" onclick="tab='profile';render()"><i class="fas fa-store-alt"></i> Shop Profile</button>
    </div>
    <div id="body">${inner}</div>
  </div>`;
}

async function render(){
  if(!me){ loginView(); return; }
  shell('<div class="empty">Loading…</div>');
  try{
    if(tab==='orders'){
      const d = await api('/api/seller/orders');
      const list = d.orders||[];
      $('#body').innerHTML = list.length ? list.map(o=>{
        const items = (o.items||[]).map(i=>esc(i.name)+(i.variant?' ['+esc(i.variant)+']':'')+' ×'+i.qty).join(', ');
        const b=o.buyer||{};
        const opts = (d.statuses||[]).map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${STATUS_LABEL[s]||s}</option>`).join('');
        return `<div class="card">
          <div class="row"><span class="ref">${esc(o.ref)}</span><span class="pill ${esc(o.status)}">${esc(STATUS_LABEL[o.status]||o.status)}</span></div>
          <div class="items">${items}</div>
          <div class="buyer"><b>${esc(b.name||'')}</b> · <a href="tel:${esc(b.phone||'')}">${esc(b.phone||'')}</a><br>
            ${b.method==='pickup'?'<i class="fas fa-store"></i> Pickup at shop':'<i class="fas fa-truck-fast"></i> '+esc((b.area||'')+' — '+(b.addr||''))}
            ${b.geo?` · <a href="${esc(b.geo)}" target="_blank" rel="noopener">map</a>`:''}</div>
          <div class="row">
            <span class="muted">subtotal ${o.subtotal} + delivery ${o.delivery_fee} + VAT ${o.tax} → <span class="tot">${o.total} ETB</span></span>
            <span>
              <select id="st-${esc(o.ref)}">${opts}</select>
              <button class="btn" onclick="setStatus('${esc(o.ref)}')">Update</button>
            </span>
          </div>
          <div class="muted" style="margin-top:6px"><i class="fas fa-comment-sms"></i> The buyer gets an SMS when you confirm payment, send it out, deliver, or cancel.</div>
        </div>`;
      }).join('') : '<div class="empty"><i class="fas fa-receipt"></i><br>No orders yet. They will appear here the moment a buyer checks out.</div>';
    } else if(tab==='stock'){
      const cat = await api('/api/catalog');
      const t = (cat.building.tenants||[]).find(x=>x.id===me.id) || {products:[]};
      $('#body').innerHTML = `<div class="card muted" style="margin-bottom:14px"><i class="fas fa-circle-info"></i>
        Change a price or stock state and press <b>Save</b> on that row — the storefront updates instantly. Mark items <b>Sold out</b> to stop new orders; buyers can then request “notify me”. Use <b>ON/OFF</b> to hide an item from the storefront entirely without losing it — turn it back on any time.</div>` +
        t.products.map(p=>`<div class="card prod${p.active===false?' is-off':''}">
          <div><b>${esc(p.name)}</b><div class="muted">${esc(p.cat)} · ${esc(p.id)}${p.active===false?' · <span style="color:#c2185b;font-weight:700">OFF</span>':''}</div></div>
          <input type="number" id="pr-${esc(p.id)}" value="${p.price}" min="1"> 
          <select id="sk-${esc(p.id)}">
            <option value="in" ${p.stock&&p.stock.state==='in'?'selected':''}>In stock</option>
            <option value="low" ${p.stock&&p.stock.state==='low'?'selected':''}>Low (few left)</option>
            <option value="made" ${p.stock&&p.stock.state==='made'?'selected':''}>Made to order</option>
            <option value="out" ${p.stock&&p.stock.state==='out'?'selected':''}>Sold out</option>
          </select>
          <button class="btn" onclick="saveProd('${esc(p.id)}')">Save</button>
          <button class="btn" style="background:#1769aa" onclick="editPhotos('${esc(p.id)}')"><i class="fas fa-image"></i> Photos</button>
          <button class="btn ${p.active===false?'':'wine'}" style="${p.active===false?'background:#2f9e44':''}" onclick="toggleActive('${esc(p.id)}',${p.active===false})">${p.active===false?'Turn ON':'Turn OFF'}</button>
          <div id="ph-${esc(p.id)}" style="width:100%"></div>
        </div>`).join('');
      window.__prods = t.products;
    } else if(tab==='profile'){
      const cat = await api('/api/catalog');
      const t = (cat.building.tenants||[]).find(x=>x.id===me.id) || {};
      const soc = t.socials || {};
      const PLATFORMS = [
        ['instagram','Instagram','fab fa-instagram','yourhandle'],
        ['facebook','Facebook','fab fa-facebook-f','yourpage'],
        ['tiktok','TikTok','fab fa-tiktok','yourhandle'],
        ['telegram','Telegram','fab fa-telegram-plane','yourchannel'],
        ['youtube','YouTube','fab fa-youtube','yourchannel'],
        ['website','Website','fas fa-globe','https://yourshop.com'],
      ];
      window.__soc = {};
      PLATFORMS.forEach(([key])=>{
        const entry = soc[key];
        const value = entry ? (typeof entry==='object' ? entry.value : entry) : '';
        const on = entry ? (typeof entry==='object' ? entry.on!==false : true) : true;
        window.__soc[key] = {value, on};
      });
      $('#body').innerHTML = `
        <div class="card muted" style="margin-bottom:14px"><i class="fas fa-circle-info"></i>
          This is what buyers see about your shop on the storefront. A short, honest description works best — no need to overstate anything.</div>
        <div class="card">
          <b>Shop description</b>
          <div class="muted" style="margin:4px 0 8px">Shown on your shop card and profile. Keep it brief — a sentence or two.</div>
          <textarea class="desc" id="pf-blurb" maxlength="240" oninput="document.getElementById('pf-ct').textContent=240-this.value.length">${esc(t.blurb||'')}</textarea>
          <div class="charct"><span id="pf-ct">${240-(t.blurb||'').length}</span> characters left</div>
        </div>
        <div class="card">
          <b>Social links</b>
          <div class="muted" style="margin:4px 0 10px">Add your handle or full link, then use the switch to show or hide it — nothing is lost when you turn one off.</div>
          ${PLATFORMS.map(([key,label,icon,ph])=>`
            <div class="soc-row">
              <span class="soc-ic ${key}"><i class="${icon}"></i></span>
              <input id="pf-soc-${key}" placeholder="${esc(ph)}" value="${esc(window.__soc[key].value)}" oninput="window.__soc['${key}'].value=this.value">
              <label class="toggle" title="Show on storefront">
                <input type="checkbox" id="pf-on-${key}" ${window.__soc[key].on?'checked':''} onchange="window.__soc['${key}'].on=this.checked">
                <span class="track"><span class="knob"></span></span>
              </label>
            </div>`).join('')}
        </div>
        <div style="text-align:right"><button class="btn wine" onclick="saveProfile()"><i class="fas fa-check"></i> Save shop profile</button></div>`;
    }
  }catch(e){
    if((''+e.message).match(/sign in/i)){ me=null; loginView('Session expired — please sign in again.'); return; }
    $('#body').innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>';
  }
}
async function setStatus(ref){
  const sel = document.getElementById('st-'+ref);
  try{ await api('/api/seller/order-status',{method:'POST',body:{ref, status:sel.value}}); render(); }
  catch(e){ alert(e.message); }
}
async function saveProd(pid){
  const price = document.getElementById('pr-'+pid).value;
  const state = document.getElementById('sk-'+pid).value;
  try{
    await api('/api/seller/product',{method:'POST',body:{pid, price:+price, stock:{state, label: state==='low'?'2':''}}});
    render();
  }catch(e){ alert(e.message); }
}
async function toggleActive(pid, turnOn){
  try{ await api('/api/seller/product',{method:'POST',body:{pid, active:turnOn}}); render(); }catch(e){ alert(e.message); }
}
async function saveProfile(){
  const blurb = document.getElementById('pf-blurb').value.trim();
  const socials = {};
  Object.keys(window.__soc||{}).forEach(k=>{ socials[k] = window.__soc[k]; });
  try{
    await api('/api/seller/profile',{method:'POST',body:{blurb, socials}});
    render();
  }catch(e){ alert(e.message); }
}
/* ── product photos: up to 3, uploaded as compressed data-URLs ── */
window.__img = {};
function editPhotos(pid){
  const p=(window.__prods||[]).find(x=>x.id===pid); if(!p) return;
  const box=document.getElementById('ph-'+pid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const gal=(p.gallery&&p.gallery.length?p.gallery:[p.img]).filter(Boolean);
  let slots='';
  for(let i=0;i<3;i++){
    const key=pid+'-'+i, cur=gal[i]||'';
    window.__img[key]=cur;
    slots+=`<div style="width:96px">
      <div id="th-${key}" onclick="pickImg('${key}')" style="width:96px;height:72px;border:1.5px ${cur?'solid #8a1450':'dashed #cbb'};border-radius:9px;background:#fff center/cover no-repeat ${cur?`url('${cur}')`:''};display:flex;align-items:center;justify-content:center;color:#bba;font-size:1.1rem;cursor:pointer">${cur?'':'+'}</div>
      <button onclick="clearImg('${key}')" style="display:block;width:100%;margin-top:4px;background:#eee;color:#a55;font-size:.62rem;padding:3px 0;border:0;border-radius:6px;cursor:pointer">clear</button>
    </div>`;
  }
  box.innerHTML=`<div style="background:#f8f5f7;border:1px dashed #d7c4cd;border-radius:11px;padding:12px;margin-top:10px">
    <div class="muted" style="margin-bottom:8px"><b>Product photos (up to 3)</b> — the first is the main image. Tap a box to upload; photos are compressed automatically.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${slots}</div>
    <div style="margin-top:10px;text-align:right"><button class="btn" onclick="savePhotos('${pid}')">Save photos</button></div>
  </div>`;
}
function pickImg(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const mx=900, sc=Math.min(1, mx/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        const url=cv.toDataURL('image/jpeg',.82);
        window.__img[key]=url;
        const th=document.getElementById('th-'+key);
        th.style.border='1.5px solid #8a1450';
        th.style.background=`#fff center/cover no-repeat url('${url}')`;
        th.textContent='';
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function clearImg(key){
  window.__img[key]='';
  const th=document.getElementById('th-'+key);
  if(th){ th.style.border='1.5px dashed #cbb'; th.style.background='#fff'; th.textContent='+'; }
}
async function savePhotos(pid){
  const gallery=[];
  for(let i=0;i<3;i++){ const v=window.__img[pid+'-'+i]; if(v) gallery.push(v); }
  if(!gallery.length){ alert('Add at least one photo, or close the editor.'); return; }
  try{
    await api('/api/seller/product',{method:'POST',body:{pid, gallery}});
    render();
  }catch(e){ alert(e.message); }
}
/* boot: restore session if cookie valid */
api('/api/seller/me').then(d=>{ me=d.tenant; render(); }).catch(()=>loginView());
</script>
</body>
</html>
