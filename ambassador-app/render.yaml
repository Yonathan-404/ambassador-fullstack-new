# Render Blueprint — deploy with "New +" → "Blueprint" pointing at this repo.
services:
  - type: web
    name: ambassador-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ambassador-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false        # set in dashboard after creating a Google OAuth client
      - key: TELEGRAM_BOT_TOKEN
        sync: false        # optional: order notifications
      - key: TELEGRAM_CHAT_ID
        sync: false        # optional
databases:
  - name: ambassador-db
    plan: free
