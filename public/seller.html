<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller Portal · Ambassador Shopping Mall</title>
<meta name="theme-color" content="#8a1450">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seller Portal">
<link rel="manifest" href="/seller-manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{--wine:#8a1450;--wine-d:#5e1338;--wine-deep:#420d27;--gold:#D4AF37;--gold-d:#b8941f;--gold-deep:#8a6d12;
        --accent:#9c2f63;--teal:#9c2f63;--ink:#221820;--mid:#7d6e76;--line:#efe6ea;--bg:#faf6f8;--wa:#25D366}
  *{box-sizing:border-box}
  body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0}
  .top{background:linear-gradient(135deg,var(--wine),var(--wine-deep));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;
       border-bottom:2px solid var(--gold);box-shadow:0 6px 20px -10px rgba(66,13,39,.7)}
  .top .logos{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .top .logos img{height:34px;width:34px;object-fit:contain;border-radius:8px;background:#fff;padding:2px}
  .top h1{font-size:1.02rem;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
  .brandbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 20px;background:#fff;
            border-bottom:1px solid var(--line);font-size:.7rem;color:var(--mid);letter-spacing:.4px}
  .brandbar img{height:18px;width:auto;border-radius:4px}
  .brandbar b{color:var(--wine)}
  .instbtn{background:linear-gradient(135deg,var(--gold-d),var(--gold-deep))!important}
  .top .shop{font-size:.8rem;opacity:.85}
  .top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-size:.8rem}
  .wrap{max-width:860px;margin:0 auto;padding:18px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{flex:1;padding:11px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--mid)}
  .tabs button.on{border-color:var(--wine);color:#fff;background:linear-gradient(135deg,var(--wine),var(--wine-d));box-shadow:0 6px 16px -8px rgba(66,13,39,.7)}
  .tabs button{transition:.2s}
  .tabs button:hover{border-color:var(--wine)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;font-size:.86rem}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .ref{font-family:ui-monospace,monospace;font-weight:700;color:var(--wine)}
  .muted{color:var(--mid);font-size:.78rem}
  .tot{font-weight:800;color:var(--wine);font-size:1rem}
  .pill{border-radius:99px;padding:3px 11px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .pill.placed{background:#eee;color:#666}.pill.confirmed{background:#e6f4ff;color:#1769aa}
  .pill.preparing{background:#fff7e0;color:#9a6b00}.pill.out_for_delivery{background:#efe9ff;color:#6b3fd1}
  .pill.delivered{background:#e9f8ee;color:#1d9e54}.pill.cancelled{background:#fdeaf0;color:#c2185b}
  select,input{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:.85rem;background:#fff}
  
  .btn{background:linear-gradient(135deg,var(--gold-d),var(--gold-deep));color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.82rem}
  .btn.wine{background:linear-gradient(135deg,var(--wine),var(--wine-d))}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5}
  .login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
  .login .logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--wine),#b03d77);color:#fff;font-size:1.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .login h2{margin:0 0 4px;font-size:1.25rem}
  .login p{color:var(--mid);font-size:.82rem;margin:0 0 18px}
  .login input{width:100%;margin-bottom:10px}
  .login .btn{width:100%;padding:12px}
  .err{color:#c2185b;font-size:.8rem;min-height:18px;margin-top:8px}
  .items{color:var(--mid);font-size:.78rem;line-height:1.6;margin:6px 0}
  .buyer{background:var(--bg);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:.8rem}
  .empty{text-align:center;color:#aaa;padding:48px 10px}
  .prod{display:grid;grid-template-columns:1fr 100px 140px 60px 90px;gap:8px;align-items:center}
  .prod.is-off{opacity:.55;background:#fafafa}
  @media(max-width:640px){.prod{grid-template-columns:1fr 1fr}}
.swwrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
  .swgroup{display:flex;flex-direction:column;gap:4px}
  .swlabel{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mid);font-weight:700}
  .swrow{display:flex;gap:5px}
  .sw{width:28px;height:28px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:.15s}
  .sw:hover{transform:scale(1.12)}
  .sw.on{box-shadow:0 0 0 2px var(--wine);transform:scale(1.12)}
  .swprev{width:32px;height:32px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:inline-block;flex-shrink:0}
  .logoprev{width:74px;height:74px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);
    background:var(--wine);background-size:cover;background-position:center;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;flex-shrink:0}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .stat .n{font-size:1.5rem;font-weight:800;color:var(--wine);line-height:1.1}
  .stat .l{font-size:.68rem;color:var(--mid);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:2px}
  .savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px;display:none;text-align:right}
  /* shop profile tab */
  textarea.desc{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.86rem;resize:vertical;min-height:80px}
  textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.86rem;resize:vertical;background:#fff;color:var(--ink);box-sizing:border-box}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
  .grid input{width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.22)}
  .charct{text-align:right;font-size:.72rem;color:var(--mid);margin-top:4px}
  .soc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .soc-row:last-child{border-bottom:0}
  .soc-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;flex-shrink:0}
  .soc-ic.instagram{background:linear-gradient(45deg,#FFDC80,#FCAF45,#F56040,#C13584)}
  .soc-ic.facebook{background:#4267B2}.soc-ic.tiktok{background:#010101}
  .soc-ic.telegram{background:#229ED9}.soc-ic.youtube{background:#FF0000}.soc-ic.website{background:#7d6e76}
  .soc-row input{flex:1;min-width:0}
  .toggle{position:relative;width:42px;height:24px;flex-shrink:0}
  .toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .toggle .track{position:absolute;inset:0;background:#ddd;border-radius:99px;transition:.2s}
  .toggle .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .toggle input:checked ~ .track{background:var(--teal)}
  .toggle input:checked ~ .track .knob{transform:translateX(18px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => (''+(s==null?'':s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATUS_LABEL = {placed:'Placed', confirmed:'Payment confirmed', preparing:'Preparing', out_for_delivery:'Out for delivery', delivered:'Delivered', cancelled:'Cancelled'};
let me = null, tab = 'orders';

async function api(path, opts){
  const o = opts||{};
  const r = await fetch(path, { method:o.method||'GET',
    headers:o.body?{'Content-Type':'application/json'}:undefined,
    body:o.body?JSON.stringify(o.body):undefined, credentials:'same-origin' });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}

function loginView(msg){
  $('#app').innerHTML = `
  <div class="login">
    <div class="logo">A</div>
    <h2>Seller Portal</h2>
    <p>Ambassador Shopping Mall · sign in with the phone and access code given to you by Bisinka Marketplace.</p>
    <input id="ph" type="tel" placeholder="Phone (09xx xxx xxx)">
    <input id="code" type="password" placeholder="Access code" inputmode="numeric">
    <button class="btn wine" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i> Sign in</button>
    <div class="err" id="err">${esc(msg||'')}</div>
  </div>`;
}
async function doLogin(){
  try{
    const d = await api('/api/seller/login', {method:'POST', body:{phone:$('#ph').value, code:$('#code').value}});
    me = d.tenant; render();
  }catch(e){ $('#err').textContent = e.message; }
}
async function doLogout(){ await api('/api/seller/logout',{method:'POST',body:{}}).catch(()=>{}); me=null; loginView(); }

function shell(inner){
  $('#app').innerHTML = `
  <div class="top">
    <span class="logos">
      <img src="/media/ambassador-logo.png" alt="Ambassador Shopping Mall">
      <img src="/media/bisinka-logo.png" alt="Bisinka">
    </span>
    <h1>${esc(me.name)}</h1>
    <span class="shop">${esc(me.floor)} · Seller Portal</span>
    <button id="sellerInstall" style="display:none" class="instbtn" onclick="installApp()"><i class="fas fa-mobile-screen-button"></i> Install</button>
    <button onclick="doLogout()"><i class="fas fa-right-from-bracket"></i> Sign out</button></div>
  <div class="brandbar"><img src="/media/bisinka-logo.png" alt=""> Ambassador Shopping Mall seller portal &mdash; powered by <b>Bisinka</b></div>
  <div class="wrap">
    <div class="tabs">
      <button class="${tab==='orders'?'on':''}" onclick="tab='orders';render()"><i class="fas fa-receipt"></i> Orders</button>
      <button class="${tab==='stock'?'on':''}" onclick="tab='stock';render()"><i class="fas fa-boxes-stacked"></i> Products</button>
      <button class="${tab==='profile'?'on':''}" onclick="tab='profile';render()"><i class="fas fa-store-alt"></i> Shop Profile</button>
      <button class="${tab==='jobs'?'on':''}" onclick="tab='jobs';render()"><i class="fas fa-briefcase"></i> Vacancies</button>
    </div>
    <div id="body">${inner}</div>
  </div>`;
}

async function render(){
  if(!me){ loginView(); return; }
  shell('<div class="empty">Loading…</div>');
  try{
    if(tab==='orders'){
      const [d, st] = await Promise.all([
        api('/api/seller/orders'),
        api('/api/seller/stats?days=7').catch(()=>null)
      ]);
      if(st){
        const strip = `<div class="card"><b>Your shop this week</b>
          <div class="muted" style="margin:2px 0 10px">How many people opened your shop page, and how often it was shared.</div>
          <div class="statgrid">
            <div class="stat"><div class="n">${st.visits.today}</div><div class="l">Visits today</div></div>
            <div class="stat"><div class="n">${st.visits.window}</div><div class="l">Visits · 7 days</div></div>
            <div class="stat"><div class="n">${st.shares.window}</div><div class="l">Shares · 7 days</div></div>
            <div class="stat"><div class="n">${st.visits.total}</div><div class="l">Visits all time</div></div>
          </div></div>`;
        setTimeout(()=>{ const b=$('#body'); if(b) b.insertAdjacentHTML('afterbegin', strip); }, 0);
      }
      const list = d.orders||[];
      $('#body').innerHTML = list.length ? list.map(o=>{
        const items = (o.items||[]).map(i=>esc(i.name)+(i.variant?' ['+esc(i.variant)+']':'')+' ×'+i.qty).join(', ');
        const b=o.buyer||{};
        const opts = (d.statuses||[]).map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${STATUS_LABEL[s]||s}</option>`).join('');
        return `<div class="card">
          <div class="row"><span class="ref">${esc(o.ref)}</span><span class="pill ${esc(o.status)}">${esc(STATUS_LABEL[o.status]||o.status)}</span></div>
          <div class="items">${items}</div>
          <div class="buyer"><b>${esc(b.name||'')}</b> · <a href="tel:${esc(b.phone||'')}">${esc(b.phone||'')}</a><br>
            ${b.method==='pickup'?'<i class="fas fa-store"></i> Pickup at shop':'<i class="fas fa-truck-fast"></i> '+esc((b.area||'')+' — '+(b.addr||''))}
            ${b.geo?` · <a href="${esc(b.geo)}" target="_blank" rel="noopener">map</a>`:''}</div>
          <div class="row">
            <span class="muted">subtotal ${o.subtotal} + delivery ${o.delivery_fee} + VAT ${o.tax} → <span class="tot">${o.total} ETB</span></span>
            <span>
              <select id="st-${esc(o.ref)}">${opts}</select>
              <button class="btn" onclick="setStatus('${esc(o.ref)}')">Update</button>
            </span>
          </div>
          <div class="muted" style="margin-top:6px"><i class="fas fa-comment-sms"></i> The buyer gets an SMS when you confirm payment, send it out, deliver, or cancel.</div>
        </div>`;
      }).join('') : '<div class="empty"><i class="fas fa-receipt"></i><br>No orders yet. They will appear here the moment a buyer checks out.</div>';
    } else if(tab==='stock'){
      const cat = await api('/api/catalog');
      const t = (cat.building.tenants||[]).find(x=>x.id===me.id) || {products:[]};
      $('#body').innerHTML = `<div class="card muted" style="margin-bottom:14px"><i class="fas fa-circle-info"></i>
        Change a price or stock state and press <b>Save</b> on that row — the storefront updates instantly. Mark items <b>Sold out</b> to stop new orders; buyers can then request “notify me”. Use <b>ON/OFF</b> to hide an item from the storefront entirely without losing it — turn it back on any time.</div>` +
        t.products.map(p=>`<div class="card prod${p.active===false?' is-off':''}">
          <div><b>${esc(p.name)}</b><div class="muted">${esc(p.cat)} · ${esc(p.id)}${p.active===false?' · <span style="color:#c2185b;font-weight:700">OFF</span>':''}</div></div>
          <input type="number" id="pr-${esc(p.id)}" value="${p.price}" min="1"> 
          <select id="sk-${esc(p.id)}">
            <option value="in" ${p.stock&&p.stock.state==='in'?'selected':''}>In stock</option>
            <option value="low" ${p.stock&&p.stock.state==='low'?'selected':''}>Low (few left)</option>
            <option value="made" ${p.stock&&p.stock.state==='made'?'selected':''}>Made to order</option>
            <option value="out" ${p.stock&&p.stock.state==='out'?'selected':''}>Sold out</option>
          </select>
          <button class="btn" onclick="saveProd('${esc(p.id)}')">Save</button>
          <button class="btn" style="background:#1769aa" onclick="editPhotos('${esc(p.id)}')"><i class="fas fa-image"></i> Photos</button>
          <button class="btn ${p.active===false?'':'wine'}" style="${p.active===false?'background:#2f9e44':''}" onclick="toggleActive('${esc(p.id)}',${p.active===false})">${p.active===false?'Turn ON':'Turn OFF'}</button>
          <button class="btn" style="background:#1769aa" onclick="editProd('${esc(p.id)}')"><i class="fas fa-pen"></i> Edit</button>
          <button class="btn" style="background:#c2185b" onclick="removeProd('${esc(p.id)}')"><i class="fas fa-trash"></i></button>
          <div id="pe-${esc(p.id)}" style="width:100%"></div>
          <div id="ph-${esc(p.id)}" style="width:100%"></div>
        </div>`).join('') +
        `<div class="card">
          <b>Add a new product</b>
          <div class="muted" style="margin:4px 0 10px">Your product appears on the storefront as soon as you add it.</div>
          <div class="grid">
            <input id="np-name" placeholder="Product name">
            <input id="np-cat" placeholder="Category (e.g. Jewelry & Accessories)">
            <input id="np-price" type="number" placeholder="Price (ETB)">
            <input id="np-old" type="number" placeholder="Old price (optional — shows a discount)">
          </div>
          <textarea id="np-desc" rows="2" placeholder="Short description" style="margin-top:9px"></textarea>
          <div style="text-align:right;margin-top:10px"><button class="btn wine" onclick="addProd()"><i class="fas fa-plus"></i> Add product</button></div>
        </div>`;
      window.__prods = t.products;
    } else if(tab==='jobs'){
      const d = await api('/api/seller/jobs');
      window.__jobs = d.jobs || [];
      $('#body').innerHTML = `
        <div class="card muted"><i class="fas fa-circle-info"></i>
          Hiring for your shop? Post the vacancy here and it appears publicly on the mall's job board,
          alongside openings from Ambassador management. Applicants can call or WhatsApp you directly.</div>
        <div id="jobList">${renderJobList()}</div>
        <div class="card">
          <b>Post a vacancy</b>
          <div class="grid" style="margin-top:10px">
            <input id="jb-position" placeholder="Position (e.g. Sales Assistant)">
            <input id="jb-type" placeholder="Full-time / Part-time / Contract">
            <input id="jb-salary" placeholder="Salary, e.g. 6000">
            <input id="jb-hours" placeholder="Working hours, e.g. Mon–Sat 9:00–19:00">
            <input id="jb-deadline" placeholder="Apply by (optional)">
            <input id="jb-phone" placeholder="Contact phone (blank = your shop phone)">
          </div>
          <label style="display:flex;align-items:center;gap:7px;margin-top:9px;font-size:.82rem">
            <input type="checkbox" id="jb-negotiable"> Salary negotiable
          </label>
          <textarea id="jb-desc" rows="3" placeholder="Describe the role, requirements, experience needed…" style="margin-top:9px"></textarea>
          <div style="text-align:right;margin-top:10px"><button class="btn wine" onclick="postJob()"><i class="fas fa-plus"></i> Post vacancy</button></div>
        </div>`;
    } else if(tab==='profile'){
      const cat = await api('/api/catalog');
      const t = (cat.building.tenants||[]).find(x=>x.id===me.id) || {};
      const soc = t.socials || {};
      const PLATFORMS = [
        ['instagram','Instagram','fab fa-instagram','yourhandle'],
        ['facebook','Facebook','fab fa-facebook-f','yourpage'],
        ['tiktok','TikTok','fab fa-tiktok','yourhandle'],
        ['telegram','Telegram','fab fa-telegram-plane','yourchannel'],
        ['youtube','YouTube','fab fa-youtube','yourchannel'],
        ['website','Website','fas fa-globe','https://yourshop.com'],
      ];
      window.__soc = {};
      window.__shopColor = t.color || '#8a1450';
      window.__shopLogo  = undefined;   // only sent if the seller picks a new file
      PLATFORMS.forEach(([key])=>{
        const entry = soc[key];
        const value = entry ? (typeof entry==='object' ? entry.value : entry) : '';
        const on = entry ? (typeof entry==='object' ? entry.on!==false : true) : true;
        window.__soc[key] = {value, on};
      });
      $('#body').innerHTML = `
        <div class="card muted" style="margin-bottom:14px"><i class="fas fa-circle-info"></i>
          This is what buyers see about your shop on the storefront. A short, honest description works best — no need to overstate anything.</div>
        <div class="card">
          <b>Shop description</b>
          <div class="muted" style="margin:4px 0 8px">Shown on your shop card and profile. Keep it brief — a sentence or two.</div>
          <textarea class="desc" id="pf-blurb" maxlength="240" oninput="document.getElementById('pf-ct').textContent=240-this.value.length">${esc(t.blurb||'')}</textarea>
          <div class="charct"><span id="pf-ct">${240-(t.blurb||'').length}</span> characters left</div>
        </div>
        <div class="card">
          <b>Social links</b>
          <div class="muted" style="margin:4px 0 10px">Add your handle or full link, then use the switch to show or hide it — nothing is lost when you turn one off.</div>
          ${PLATFORMS.map(([key,label,icon,ph])=>`
            <div class="soc-row">
              <span class="soc-ic ${key}"><i class="${icon}"></i></span>
              <input id="pf-soc-${key}" placeholder="${esc(ph)}" value="${esc(window.__soc[key].value)}" oninput="window.__soc['${key}'].value=this.value">
              <label class="toggle" title="Show on storefront">
                <input type="checkbox" id="pf-on-${key}" ${window.__soc[key].on?'checked':''} onchange="window.__soc['${key}'].on=this.checked">
                <span class="track"><span class="knob"></span></span>
              </label>
            </div>`).join('')}
        </div>
        <div class="card">
          <b>Shop logo & card colour</b>
          <div class="muted" style="margin:4px 0 10px">Your logo appears on your shop card. Until you add one, your initials are shown. The colour is used for your card and product tags.</div>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
            <div id="pf-logoprev" class="logoprev" style="${t.logo?`background-image:url(${esc(t.logo)})`:''}">${t.logo?'':esc((t.name||'').split(' ').slice(0,2).map(w=>w.charAt(0)).join(''))}</div>
            <div>
              <input type="file" accept="image/*" onchange="uploadShopLogo(this)">
              <div class="muted" style="margin-top:4px">Square images work best.</div>
            </div>
            <span style="display:flex;align-items:center;gap:8px;margin-left:auto">
              <span class="muted">Card colour</span>
              <span id="pf-colorprev" class="swprev" style="background:${esc(t.color||'#8a1450')}"></span>
            </span>
          </div>
          <div id="pf-sw" class="swwrap">${swatchHTML(t.color)}</div>
        </div>
        <div class="card">
          <div class="soc-row" style="border-bottom:0;padding:2px 0">
            <span class="soc-ic" style="background:var(--wine)"><i class="fas fa-calendar-check"></i></span>
            <div style="flex:1;min-width:0">
              <b>Accept appointment bookings</b>
              <div class="muted">Shows a “Book Appointment” button on your shop page. Requests arrive on your WhatsApp with the date and time already filled in.</div>
            </div>
            <label class="toggle" title="Accept bookings">
              <input type="checkbox" id="pf-appt" ${t.appointments?'checked':''}>
              <span class="track"><span class="knob"></span></span>
            </label>
          </div>
        </div>
        <div style="text-align:right"><button class="btn wine" onclick="saveProfile()"><i class="fas fa-check"></i> Save shop profile</button></div>
        <div class="card" style="margin-top:16px">
          <b><i class="fas fa-key"></i> Change your access code</b>
          <div class="muted" style="margin:4px 0 10px">Only you know this code — it is stored encrypted, so nobody can read it back to you. If you forget it, ask mall management to issue a new one.</div>
          <div class="grid">
            <input id="pw-cur" type="password" placeholder="Current access code" autocomplete="current-password">
            <input id="pw-new" type="password" placeholder="New code (min 6 characters)" autocomplete="new-password">
            <input id="pw-rep" type="password" placeholder="Repeat new code" autocomplete="new-password">
          </div>
          <div class="err" id="pw-err" style="min-height:18px"></div>
          <div style="text-align:right"><button class="btn" onclick="changeCode()"><i class="fas fa-shield-halved"></i> Update access code</button></div>
        </div>`;
    }
  }catch(e){
    if((''+e.message).match(/sign in/i)){ me=null; loginView('Session expired — please sign in again.'); return; }
    $('#body').innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>';
  }
}
async function setStatus(ref){

  try{ await api('/api/seller/order-status',{method:'POST',body:{ref, status:sel.value}}); render(); }
  catch(e){ alert(e.message); }
}
async function saveProd(pid){

  const state = document.getElementById('sk-'+pid).value;

    await api('/api/seller/product',{method:'POST',body:{pid, price:+price, stock:{state, label: state==='low'?'2':''}}});

}
async function toggleActive(pid, turnOn){

}
/* full product control for the shop's own catalog */
function editProd(pid){
  const p=(window.__prods||[]).find(x=>x.id===pid); if(!p) return;
  const box=document.getElementById('pe-'+pid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  box.innerHTML=`<div style="background:#faf6f8;border:1px dashed #dcc9d4;border-radius:11px;padding:12px;margin-top:10px">
    <div class="grid">
      <input id="ep-name-${pid}" value="${esc(p.name)}" placeholder="Name">
      <input id="ep-cat-${pid}" value="${esc(p.cat||'')}" placeholder="Category">
      <input id="ep-price-${pid}" type="number" value="${p.price}" placeholder="Price">
      <input id="ep-old-${pid}" type="number" value="${p.old||''}" placeholder="Old price (optional)">
    </div>
    <textarea id="ep-desc-${pid}" rows="2" placeholder="Description" style="margin-top:9px">${esc(p.desc||'')}</textarea>

async function saveProdEdit(pid){
  const g=id=>document.getElementById(id).value.trim();
  try{
    await api('/api/seller/product',{method:'PUT',body:{product:{
      id:pid, name:g('ep-name-'+pid), cat:g('ep-cat-'+pid),
      price:+g('ep-price-'+pid)||1, old:+g('ep-old-'+pid)||null,
      desc:document.getElementById('ep-desc-'+pid).value.trim()
    }}});

  }catch(e){ alert(e.message); }
}
async function addProd(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('np-name')){ alert('Product name is required.'); return; }
  try{
    await api('/api/seller/product',{method:'PUT',body:{product:{
      name:g('np-name'), cat:g('np-cat')||'General', price:+g('np-price')||1,
      old:+g('np-old')||null, desc:document.getElementById('np-desc').value.trim()
    }}});
    render();

async function removeProd(pid){
  if(!confirm('Delete this product permanently? This cannot be undone.')) return;
  try{ await api('/api/seller/product/'+pid,{method:'DELETE'}); render(); }catch(e){ alert(e.message); }

function renderJobList(){
  const list = window.__jobs || [];
  if(!list.length) return '<div class="card muted">No vacancies posted yet.</div>';
  return list.map(j=>`<div class="card">
    <div class="row">
      <div><b>${esc(j.position)}</b>
        <div class="muted">${j.salary?('ETB '+esc(j.salary)):(j.negotiable?'Negotiable':'—')}${j.hours?(' · '+esc(j.hours)):''}${j.employmentType?(' · '+esc(j.employmentType)):''}</div>
      </div>
      <button class="btn" style="background:#c2185b" onclick="deleteJob('${esc(j.id)}')"><i class="fas fa-trash"></i> Remove</button>
    </div>
    ${j.description?`<div class="muted" style="margin-top:8px">${esc(j.description)}</div>`:''}
  </div>`).join('');
}
async function postJob(){
  const g=id=>document.getElementById(id).value.trim();
  const position=g('jb-position');
  if(!position){ alert('Position is required.'); return; }
  try{
    await api('/api/seller/jobs',{method:'POST',body:{
      position, employmentType:g('jb-type'), salary:g('jb-salary'), hours:g('jb-hours'),
      deadline:g('jb-deadline'), contactPhone:g('jb-phone'),
      negotiable:document.getElementById('jb-negotiable').checked,
      description:document.getElementById('jb-desc').value.trim()
    }});
    render();
  }catch(e){ alert(e.message); }
}
async function deleteJob(id){
  if(!confirm('Remove this vacancy from the public job board?')) return;
  try{ await api('/api/seller/jobs/'+id,{method:'DELETE'}); render(); }catch(e){ alert(e.message); }
}

/* installable seller portal */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e;
  const b=document.getElementById('sellerInstall'); if(b) b.style.display='inline-flex'; });
function installApp(){
  if(!deferredInstall){
    alert(/iPad|iPhone|iPod/.test(navigator.userAgent)
      ? 'To install: tap Share, then "Add to Home Screen".'
      : 'Use your browser menu, then "Install app".');
    return;
  }
  deferredInstall.prompt();
  deferredInstall.userChoice.then(()=>{ deferredInstall=null;
    const b=document.getElementById('sellerInstall'); if(b) b.style.display='none'; });
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}

async function changeCode(){
  const cur=document.getElementById('pw-cur').value.trim();
  const nw =document.getElementById('pw-new').value.trim();
  const rp =document.getElementById('pw-rep').value.trim();
  const err=document.getElementById('pw-err');
  err.style.color=''; err.textContent='';
  if(!cur||!nw){ err.textContent='Enter your current code and a new one.'; return; }
  if(nw!==rp){ err.textContent='The two new codes do not match.'; return; }
  if(nw.length<6){ err.textContent='New code must be at least 6 characters.'; return; }
  try{
    await api('/api/seller/change-code',{method:'POST',body:{current:cur,next:nw}});
    err.style.color='#1d7a33';
    err.textContent='Access code updated. Use the new code next time you sign in.';
    ['pw-cur','pw-new','pw-rep'].forEach(id=>document.getElementById(id).value='');
  }catch(e){ err.textContent=e.message; }
}

/* ── shop card colour palette (same set the admin console offers) ── */
const SHOP_COLORS = [
  ['Wine',['#8A1450','#A83269','#5E1338','#C25B86','#7A1A44']],
  ['Gold & Bronze',['#B8941F','#D4AF37','#8A6D12','#96601F','#7A4A1E','#C6941B']],
  ['Plum & Rose',['#9C2F63','#C13584','#D4468F','#E0579C','#A82B70']],
  ['Earth',['#B5651D','#A85C1A','#C7702A','#5B4636','#4A3A2C','#A8641C']],
  ['Blue',['#1E3A8A','#2451A8','#1E56C0','#3D5A80','#2E4560']],
  ['Deep & Neutral',['#1F2937','#374151','#0F5132','#134E4A','#4C1D95']]
];
function swatchHTML(cur){
  const c0=(cur||'#8A1450').toUpperCase();
  return SHOP_COLORS.map(([label,cols])=>`
    <div class="swgroup"><span class="swlabel">${label}</span>
      <div class="swrow">${cols.map(c=>`
        <button type="button" class="sw${c.toUpperCase()===c0?' on':''}" style="background:${c}"
          title="${c}" onclick="pickColor('${c}')"></button>`).join('')}</div>
    </div>`).join('');
}
function pickColor(hex){
  window.__shopColor=hex;
  const sw=document.getElementById('pf-sw'); if(sw) sw.innerHTML=swatchHTML(hex);
  const pv=document.getElementById('pf-colorprev'); if(pv) pv.style.background=hex;
}
function uploadShopLogo(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{
    const S=256,c=document.createElement('canvas'); c.width=c.height=S;
    const ctx=c.getContext('2d'), m=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
    window.__shopLogo=c.toDataURL('image/jpeg',0.85);
    const p=document.getElementById('pf-logoprev');
    if(p){ p.style.backgroundImage='url('+window.__shopLogo+')'; p.textContent=''; }
  }; img.src=rd.result; };
  rd.readAsDataURL(f);
}
async function saveProfile(){
  const blurb = document.getElementById('pf-blurb').value.trim();
  const socials = {};
  Object.keys(window.__soc||{}).forEach(k=>{ socials[k] = window.__soc[k]; });
  try{
    const appointments = !!document.getElementById('pf-appt').checked;
    const body = {blurb, socials, appointments};
    if(window.__shopColor) body.color = window.__shopColor;
    if(window.__shopLogo)  body.logo  = window.__shopLogo;   // omit unless changed
    await api('/api/seller/profile',{method:'POST',body});
    render();
  }catch(e){ alert(e.message); }
}
/* ── product photos: up to 3, uploaded as compressed data-URLs ── */
window.__img = {};
function editPhotos(pid){
  const p=(window.__prods||[]).find(x=>x.id===pid); if(!p) return;
  const box=document.getElementById('ph-'+pid);
  if(box.innerHTML){ box.innerHTML=''; return; }
  const gal=(p.gallery&&p.gallery.length?p.gallery:[p.img]).filter(Boolean);
  let slots='';
  for(let i=0;i<3;i++){
    const key=pid+'-'+i, cur=gal[i]||'';
    window.__img[key]=cur;
    slots+=`<div style="width:96px">
      <div id="th-${key}" onclick="pickImg('${key}')" style="width:96px;height:72px;border:1.5px ${cur?'solid #8a1450':'dashed #cbb'};border-radius:9px;background:#fff center/cover no-repeat ${cur?`url('${cur}')`:''};display:flex;align-items:center;justify-content:center;color:#bba;font-size:1.1rem;cursor:pointer">${cur?'':'+'}</div>
      <button onclick="clearImg('${key}')" style="display:block;width:100%;margin-top:4px;background:#eee;color:#a55;font-size:.62rem;padding:3px 0;border:0;border-radius:6px;cursor:pointer">clear</button>
    </div>`;
  }
  box.innerHTML=`<div style="background:#f8f5f7;border:1px dashed #d7c4cd;border-radius:11px;padding:12px;margin-top:10px">
    <div class="muted" style="margin-bottom:8px"><b>Product photos (up to 3)</b> — the first is the main image. Tap a box to upload; photos are compressed automatically.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${slots}</div>
    <div style="margin-top:10px;text-align:right"><button class="btn" onclick="savePhotos('${pid}')">Save photos</button></div>
  </div>`;
}
function pickImg(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const mx=900, sc=Math.min(1, mx/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        const url=cv.toDataURL('image/jpeg',.82);
        window.__img[key]=url;
        const th=document.getElementById('th-'+key);
        th.style.border='1.5px solid #8a1450';
        th.style.background=`#fff center/cover no-repeat url('${url}')`;
        th.textContent='';
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function clearImg(key){
  window.__img[key]='';
  const th=document.getElementById('th-'+key);
  if(th){ th.style.border='1.5px dashed #cbb'; th.style.background='#fff'; th.textContent='+'; }
}
async function savePhotos(pid){
  const gallery=[];
  for(let i=0;i<3;i++){ const v=window.__img[pid+'-'+i]; if(v) gallery.push(v); }
  if(!gallery.length){ alert('Add at least one photo, or close the editor.'); return; }
  try{
    await api('/api/seller/product',{method:'POST',body:{pid, gallery}});
    render();
  }catch(e){ alert(e.message); }
}
/* boot: restore session if cookie valid */
api('/api/seller/me').then(d=>{ me=d.tenant; render(); }).catch(()=>loginView());
