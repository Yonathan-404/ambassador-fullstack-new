<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Ambassador Shopping Mall</title>
<meta name="theme-color" content="#8a1450">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ambassador Admin">
<link rel="manifest" href="/admin-manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:#faf6f8;color:#221820;margin:0;padding:0 0 26px}
  .apphead{background:linear-gradient(135deg,#8a1450,#420d27);color:#fff;padding:13px 22px;display:flex;align-items:center;gap:12px;
           border-bottom:2px solid #D4AF37;box-shadow:0 6px 20px -10px rgba(66,13,39,.7)}
  .apphead .logos{display:flex;align-items:center;gap:7px}
  .apphead .logos img{height:34px;width:34px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
  .apphead .ttl{font-size:1.05rem;font-weight:800;flex:1}
  .apphead .ttl b{color:#FFD97A}
  .apphead a.bmslink{color:#FFD97A;font-size:.78rem;text-decoration:none;font-weight:700}
  .apphead button{background:linear-gradient(135deg,#b8941f,#8a6d12);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-size:.78rem;font-weight:700}
  .brandbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 20px;background:#fff;
            border-bottom:1px solid #efe6ea;font-size:.7rem;color:#7d6e76}
  .brandbar img{height:18px;border-radius:4px}
  .brandbar b{color:#8a1450}
  .wrap{max-width:1060px;margin:0 auto;padding:20px 22px 0}
  h1{font-size:1.25rem;display:flex;align-items:center;gap:10px}
  h1 span{background:#8a1450;color:#fff;border-radius:8px;padding:4px 10px;font-size:.75rem}
  .bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  input,select{padding:9px 12px;border:1.5px solid #ddd;border-radius:9px;font-size:.85rem;background:#fff}
  input.key{flex:1;min-width:200px}
  button{background:#8a1450;color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:600;cursor:pointer;font-size:.82rem}
  button.alt{background:#0D7A6F}button.gray{background:#888}button.danger{background:#c2185b}
  .card{background:#fff;border:1px solid #e8e2e5;border-radius:13px;padding:13px 15px;margin-bottom:10px;font-size:.84rem}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .ref{color:#8a1450;font-family:ui-monospace,monospace;font-weight:700}
  .muted{color:#8a7a84;font-size:.76rem}
  .pill{border-radius:99px;padding:2px 10px;font-size:.66rem;font-weight:800;text-transform:uppercase}
  .pill.placed{background:#eee;color:#666}.pill.confirmed{background:#e6f4ff;color:#1769aa}.pill.preparing{background:#fff7e0;color:#9a6b00}
  .pill.out_for_delivery{background:#efe9ff;color:#6b3fd1}.pill.delivered{background:#e9f8ee;color:#1d9e54}.pill.cancelled{background:#fdeaf0;color:#c2185b}
  .empty{padding:40px;text-align:center;color:#999}
  .grid{display:grid;gap:8px}
  .codebox{background:#fff7e0;border:1px solid #e8c96a;border-radius:9px;padding:8px 12px;font-weight:700;display:inline-block}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
  h3{margin:18px 0 8px;font-size:.95rem}
  .card.is-off{opacity:.55;background:#fafafa}
  .offpill{border-radius:99px;padding:2px 9px;font-size:.62rem;font-weight:800;text-transform:uppercase;background:#eee;color:#999;margin-left:6px}
  button.toggle-on{background:#2f9e44}
  button.toggle-off{background:#c2185b}
  button.hide-btn{background:#b8860b}
  button.unhide-btn{background:#5b2d8e}
  button.edit-btn{background:#1769aa}
  .hidpill{border-radius:99px;padding:2px 9px;font-size:.62rem;font-weight:800;text-transform:uppercase;background:#fff3d6;color:#9a6b00;margin-left:6px;border:1px solid #e8c96a}
  .editbox{width:100%;background:#f8f5f7;border:1px dashed #d7c4cd;border-radius:11px;padding:12px;margin-top:10px}
  .editbox textarea{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:9px;font-family:inherit;font-size:.85rem;margin-top:8px;box-sizing:border-box}
  .imgslots{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .imgslot{width:96px}
  .imgslot .thumb{width:96px;height:72px;border:1.5px dashed #cbb;border-radius:9px;background:#fff center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#bba;font-size:1.1rem;cursor:pointer;overflow:hidden}
  .imgslot .thumb.filled{border-style:solid;border-color:#8a1450}
  .imgslot .rm{display:block;width:100%;margin-top:4px;background:#eee;color:#a55;font-size:.62rem;padding:3px 0;border-radius:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .statgrid .stat{background:#fff;border:1px solid #e8e2e5;border-radius:13px;padding:14px 16px}
  .statgrid .stat .n{font-size:1.6rem;font-weight:800;color:#8a1450;line-height:1.1}
  .statgrid .stat .l{font-size:.68rem;color:#8a7a84;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:3px}
.swwrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
  .swgroup{display:flex;flex-direction:column;gap:4px}
  .swlabel{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:#8a7a84;font-weight:700}
  .swrow{display:flex;gap:5px}
  .sw{width:26px;height:26px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:pointer;padding:0}
  .sw:hover{transform:scale(1.12)}
  .sw.on{box-shadow:0 0 0 2px #8a1450;transform:scale(1.12)}
  .swprev{width:30px;height:30px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;display:inline-block;background-size:cover;background-position:center;flex-shrink:0}
  .secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
  /* ── Reports ── */
  .rep-presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .rep-preset{background:#fff;border:1.5px solid #ddd;color:#554;padding:7px 13px;border-radius:99px;font-size:.76rem;font-weight:700;cursor:pointer}
  .rep-preset.active{background:#8a1450;border-color:#8a1450;color:#fff}
  .rep-live{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;color:#1d9e54;text-transform:uppercase;letter-spacing:.4px}
  .rep-live .dot{width:7px;height:7px;border-radius:50%;background:#1d9e54;animation:repPulse 1.4s infinite}
  @keyframes repPulse{0%,100%{opacity:1}50%{opacity:.25}}
  .rep-statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .rep-stat{background:#fff;border:1px solid #e8e2e5;border-radius:13px;padding:14px 16px}
  .rep-stat .n{font-size:1.5rem;font-weight:800;color:#221820;line-height:1.1}
  .rep-stat .l{font-size:.68rem;color:#8a7a84;text-transform:uppercase;letter-spacing:.4px;margin-top:3px;font-weight:700}
  .rep-stat.commission{background:linear-gradient(135deg,#fff7e0,#fdf0d0);border-color:#e8c96a}
  .rep-stat.commission .n{color:#9a6b00}
  .rep-stat.net{background:linear-gradient(135deg,#e9f8ee,#dcf3e4);border-color:#a8dcb8}
  .rep-stat.net .n{color:#1d9e54}
  .rep-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e8e2e5;border-radius:13px;overflow:hidden;font-size:.8rem}
  .rep-table th{background:#f6f3f4;text-align:left;padding:9px 12px;font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;color:#8a7a84}
  .rep-table td{padding:9px 12px;border-top:1px solid #f0ebed}
  .rep-table tr:hover td{background:#fbf8f9}
  .rep-table .num{text-align:right;font-variant-numeric:tabular-nums}
  .rep-table .send-btn{background:#25D366;color:#fff;border:0;border-radius:7px;padding:5px 10px;font-size:.68rem;font-weight:700;cursor:pointer}
  .rep-rate-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e8e2e5;border-radius:11px;padding:10px 14px;margin:10px 0}
  .rep-rate-box input{width:80px}
  .rep-bar-chart{display:flex;align-items:flex-end;gap:4px;height:90px;margin:14px 0;padding:0 2px}
  .rep-bar{flex:1;background:linear-gradient(180deg,#c2477a,#8a1450);border-radius:4px 4px 0 0;min-height:3px;position:relative;cursor:default}
  .rep-bar:hover{background:linear-gradient(180deg,#e4406e,#a8123f)}
  @media print{
    body *{visibility:hidden}
    #repPrintArea, #repPrintArea *{visibility:visible}
    #repPrintArea{position:absolute;top:0;left:0;width:100%;padding:20px}
    .rep-table .send-btn, .rep-presets, .rep-live{display:none !important}
  }
</style>
</head>
<body>
<div class="apphead">
    <span class="logos"><img src="/media/ambassador-logo.png" alt="Ambassador Shopping Mall"><img src="/media/bisinka-logo.png" alt="Bisinka"></span>
    <span class="ttl">Ambassador Shopping Mall <b>· ADMIN</b></span>
    <a class="bmslink" href="/bms.html">→ Building Management (BMS)</a>
    <button id="adminInstall" style="display:none" onclick="installApp()"><i class="fas fa-mobile-screen-button"></i> Install</button>
  </div>
<div class="brandbar"><img src="/media/bisinka-logo.png" alt=""> Management console &mdash; powered by <b>Bisinka</b></div>
<div class="wrap">
  <div class="bar">
    <input class="key" id="key" type="password" placeholder="ADMIN_KEY" onchange="checkDataSync()">
    <button onclick="show('orders')">Orders</button>
    <button class="alt" style="background:#0e7c6b" onclick="show('reports')">📊 Reports</button>
    <button class="alt" onclick="show('sellers')">Sellers</button>
    <button class="alt" onclick="show('products')">Products</button>
    <button class="alt" onclick="show('services')">Services</button>
    <button class="alt" style="background:#0d6f6f" onclick="show('analytics')">Shop Analytics</button>
    <button class="alt" style="background:#7a4a1e" onclick="show('bmsusers')">BMS Access</button>
    <button class="alt" style="background:#5b2d8e" onclick="show('storefront')">Storefront</button>
    <button class="alt" style="background:#b8941f" onclick="show('jobs')">Vacancies</button>
    <button class="gray" onclick="show('notify')">Notify</button>
    <button class="gray" onclick="show('sms')">SMS log</button>
  </div>
  <div id="cfgStatus" class="muted" style="margin-bottom:8px"></div>
  <div id="dataSyncStatus" class="muted" style="margin-bottom:8px"></div>
  <div id="out" class="empty">Enter your ADMIN_KEY and choose a view.</div>
</div>
<script>
const out = document.getElementById('out');
const esc = s => (''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K = () => document.getElementById('key').value.trim();
const STATUS_LABEL = {placed:'Placed',confirmed:'Confirmed',preparing:'Preparing',out_for_delivery:'Out for delivery',delivered:'Delivered',cancelled:'Cancelled'};
async function api(path, opts){
  const o=opts||{};
  const r=await fetch(path,{method:o.method||'GET',headers:Object.assign({'x-admin-key':K()},o.body?{'Content-Type':'application/json'}:{}),body:o.body?JSON.stringify(o.body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
function fail(e){ out.className='empty'; out.textContent='Error: '+e.message; }

async function show(view){
  if(window.__repLiveTimer){ clearInterval(window.__repLiveTimer); window.__repLiveTimer=null; }
  if(!K()){ out.className='empty'; out.textContent='Please enter the ADMIN_KEY.'; return; }
  out.className='empty'; out.textContent='Loading…';
  try{
    if(view==='orders'){
      const d=await api('/api/admin/orders'); const list=d.orders||[]; out.className='';
      out.innerHTML=list.length?list.map(o=>{
        const items=(o.items||[]).map(i=>esc(i.name)+(i.variant?' ['+esc(i.variant)+']':'')+' ×'+i.qty).join(', ');
        const b=o.buyer||{};
        return `<div class="card"><div class="row"><span class="ref">${esc(o.ref)}</span><span class="pill ${esc(o.status)}">${esc(STATUS_LABEL[o.status]||o.status)}</span></div>
          <div class="muted">${esc(o.tenant_id)} · ${esc((o.created_at||'').toString().slice(0,19).replace('T',' '))}</div>
          <div>${items}</div>
          <div class="muted">${esc(b.name||'')} ${esc(b.phone||'')} · ${b.method==='pickup'?'pickup':esc((b.area||'')+' — '+(b.addr||''))}</div>
          <div>sub ${o.subtotal} + dlv ${o.delivery_fee} + VAT ${o.tax} = <b style="color:#8a1450">${o.total} ETB</b> → ${esc((o.bank||{}).name||'')} ${esc((o.bank||{}).acct||'')}</div>
        </div>`;}).join(''):'<div class="empty">No orders yet.</div>';
    }
    else if(view==='reports'){
      out.className='';
      out.innerHTML = `
        <div class="card">
          <div class="rep-presets" id="repPresets"></div>
          <div class="formgrid" style="margin-top:10px">
            <input type="date" id="repFrom"><input type="date" id="repTo">
            <select id="repTenantFilter"><option value="">All sellers</option></select>
            <button onclick="loadReport()">Apply</button>
          </div>
        </div>
        <div id="repBody">Loading…</div>`;
      window.__repPreset = 'mtd';
      await primeTenantFilter();
      renderRepPresets();
      setReportRange('mtd');
      await loadReport();
    }
    else if(view==='sellers'){
      const c=await api('/api/admin/catalog'); const ts=c.building.tenants||[]; out.className='';
      window.__sellers = ts;
      out.innerHTML =
        `<div class="bar"><input id="sellerSearch" class="key" placeholder="Search by name, unit, floor, or category…" oninput="renderSellerList()"></div>
         <div id="sellerList"></div>
         <h3>Add a new seller</h3><div class="card">
          <div class="formgrid">
            <input id="nt-id" placeholder="id (e.g. bluecafe)"><input id="nt-name" placeholder="Shop name">
            <input id="nt-unit" placeholder="Unit (e.g. 607)"><input id="nt-floor" placeholder="Floor (e.g. 6th Floor)">
            <input id="nt-cat" placeholder="Category (e.g. Café)">
            <input id="nt-wa" placeholder="WhatsApp (2519…)"><input id="nt-mobile" placeholder="Mobile (+251 …)">
            <input id="nt-owner" placeholder="Owner name"><input id="nt-acct" placeholder="CBE account number">
            <input id="nt-holder" placeholder="Account holder name">
          </div>
          <div style="margin-top:10px;text-align:right"><button onclick="addTenant()">Add seller</button></div>
          <div class="muted" style="margin-top:6px">New sellers get safe defaults (color, icon, empty products) and start turned ON. Generate their access code after adding, then add products in the Products tab.</div>
        </div>`;
      renderSellerList();
    }
    else if(view==='products'){
      const c=await api('/api/admin/catalog'); const ts=c.building.tenants||[]; out.className='';
      const opts=ts.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}${t.active===false?' (OFF)':''}</option>`).join('');
      window.__cat=c;
      out.innerHTML=`<div class="bar"><select id="ptid" onchange="renderProds()">${opts}</select></div><div id="prods"></div>`;
      renderProds();
    }
    else if(view==='services'){
      const c=await api('/api/admin/catalog'); const list=c.building.services||[]; out.className='';
      window.__svcs = list;
      out.innerHTML =
        list.map(s=>`<div class="card row ${s.active===false?'is-off':''}">
          <div><b>${esc(s.name)}</b> <span class="muted">(${esc(s.id)})</span>${s.active===false?'<span class="offpill">OFF</span>':''}${s.hidden?'<span class="hidpill">HIDDEN</span>':''}<div class="muted">${esc(s.floor)} · ${esc(s.type)} · ${esc(s.mobile||'—')}</div></div>
          <span>
            <button class="edit-btn" onclick="editService('${esc(s.id)}')">Edit</button>
            <button class="${s.hidden?'unhide-btn':'hide-btn'}" onclick="hideService('${esc(s.id)}',${!s.hidden})">${s.hidden?'Unhide':'Hide'}</button>
            <button class="${s.active===false?'toggle-on':'toggle-off'}" onclick="toggleService('${esc(s.id)}',${s.active===false})">${s.active===false?'Turn ON':'Turn OFF'}</button>
            <button class="danger" onclick="delService('${esc(s.id)}')">Delete</button>
          </span>
          <div id="sedit-${esc(s.id)}" style="width:100%"></div>
        </div>`).join('') +
        `<h3>Add a new service</h3><div class="card">
          <div class="formgrid">
            <input id="ns-name" placeholder="Service name"><input id="ns-floor" placeholder="Floor (e.g. 3rd Floor)">
            <input id="ns-type" placeholder="Type (e.g. Banking, Health)"><input id="ns-icon" placeholder="Icon (fa-store)">
            <input id="ns-mobile" placeholder="Mobile (+251 …)"><input id="ns-owner" placeholder="Owner name">
            <input id="ns-hours" placeholder="Hours (e.g. 9:00–19:00 daily)"><input id="ns-photo" placeholder="Photo URL (optional if uploading)">
          </div>
          <div class="muted" style="margin-top:8px"><b>Service photos (up to 2)</b></div>
          ${imgSlots('ns',2,[])}
          <textarea id="ns-blurb" placeholder="Short description" style="width:100%;margin-top:8px;padding:9px 12px;border:1.5px solid #ddd;border-radius:9px;font-family:inherit;font-size:.85rem" rows="2"></textarea>
          <div style="margin-top:10px;text-align:right"><button onclick="addService()">Add service</button></div>
          <div class="muted" style="margin-top:6px">New services start turned ON and appear immediately under Building Services on the storefront.</div>
        </div>`;
    }
    else if(view==='jobs'){
      const d=await api('/api/admin/jobs'); window.__ajobs=d.jobs||[]; out.className='';
      out.innerHTML =
        `<h3>Job vacancies</h3>
        <p class="muted">Openings posted here appear on the public job board on the storefront, next to the office-for-rent listings.
        Shops can post their own vacancies from the seller portal — those appear below too, and you can edit or remove any of them.</p>
        <div id="ajobList">${renderAdminJobs()}</div>
        <div class="card">
          <b>Post a vacancy (Ambassador management)</b>
          <div class="formgrid" style="margin-top:10px">
            <input id="aj-position" placeholder="Position (e.g. Security Officer)">
            <input id="aj-type" placeholder="Full-time / Part-time / Contract">
            <input id="aj-salary" placeholder="Salary, e.g. 8000">
            <input id="aj-hours" placeholder="Working hours">
            <input id="aj-location" placeholder="Location / department (optional)">
            <input id="aj-deadline" placeholder="Apply by (optional)">
            <input id="aj-phone" placeholder="Contact phone">
            <input id="aj-wa" placeholder="WhatsApp (2519…)">
          </div>
          <label style="display:flex;align-items:center;gap:7px;margin-top:9px;font-size:.82rem">
            <input type="checkbox" id="aj-negotiable"> Salary negotiable
          </label>
          <textarea id="aj-desc" rows="3" placeholder="Role description, requirements, experience…" style="margin-top:9px"></textarea>
          <div style="text-align:right;margin-top:10px"><button onclick="postAdminJob()">Post vacancy</button></div>
        </div>`;
    }
    else if(view==='bmsusers'){
      const d = await api('/api/admin/bms/users'); out.className='';
      window.__bmsUsers = d.users;
      out.innerHTML = `
        <h3>Building console access</h3>
        <p class="muted">Grant building-management staff their own sign-in. They can run the BMS without ever getting the master ADMIN_KEY — so they cannot edit shops, commission or the storefront.</p>
        <div class="card">
          <b>Control mode</b>
          <div class="muted" style="margin:4px 0 9px">Choose how changes are approved.</div>
          <label style="display:block;margin-bottom:6px"><input type="radio" name="bmsmode" value="single" ${d.mode!=='dual'?'checked':''} onchange="setBmsMode('single')">
            <b>Single person</b> — one manager does everything; changes apply immediately.</label>
          <label style="display:block"><input type="radio" name="bmsmode" value="dual" ${d.mode==='dual'?'checked':''} onchange="setBmsMode('dual')">
            <b>Two person (inputer + authorisor)</b> — an inputer submits, an authorisor approves. Nobody can approve their own entry.</label>
        </div>
        <div class="card">
          <b>Add a user</b>
          <div class="formgrid" style="margin-top:8px">
            <input id="bu-name" placeholder="Full name">
            <input id="bu-phone" placeholder="Phone (09…)">
            <select id="bu-role">
              <option value="manager">Manager — does everything (single mode)</option>
              <option value="inputer">Inputer — submits changes</option>
              <option value="authorisor">Authorisor — approves changes</option>
            </select>
          </div>
          <div style="text-align:right;margin-top:9px"><button onclick="addBmsUser()">Create user</button></div>
          <div id="bu-out"></div>
        </div>
        ${d.users.length?`<table><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
          ${d.users.map(u=>`<tr>
            <td><b>${esc(u.name)}</b></td><td>${esc(u.phone)}</td>
            <td>${esc(u.role)}</td>
            <td>${u.active?'<span class="tag ok">active</span>':'<span class="tag no">disabled</span>'}</td>
            <td style="white-space:nowrap">
              <button class="alt" onclick="resetBmsCode('${u.id}','${esc(u.name)}','${esc(u.phone)}','${u.role}')">New code</button>
              <button class="alt" onclick="toggleBmsUser('${u.id}',${!u.active})">${u.active?'Disable':'Enable'}</button>
              <button class="danger" onclick="delBmsUser('${u.id}')">Delete</button>
            </td></tr>`).join('')}
        </tbody></table>`:'<div class="muted">No building users yet.</div>'}`;
    }
    else if(view==='analytics'){
      const days = window.__anDays || 7;
      const d = await api('/api/admin/shop-stats?days='+days);
      out.className='';

/* image slot helpers — click a slot to pick a file; it is downscaled to a
   data-URL client-side (max 900px, JPEG). Slots also accept nothing = keep as is. */
window.__img = {};
function imgSlots(prefix, n, existing){
  let h='<div class="imgslots">';
  for(let i=0;i<n;i++){
    const key=prefix+'-'+i, cur=(existing&&existing[i])||'';
    window.__img[key]=cur;
    h+=`<div class="imgslot">
      <div class="thumb ${cur?'filled':''}" id="th-${key}" style="${cur?`background-image:url('${esc(cur)}')`:''}" onclick="pickImg('${key}')">${cur?'':'+'}</div>
      <button class="rm" onclick="clearImg('${key}')">clear</button>
    </div>`;
  }
  return h+'</div><div class="muted" style="margin-top:4px">Tap a box to upload — images are compressed automatically.</div>';
}
function pickImg(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const mx=900, sc=Math.min(1, mx/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        const url=cv.toDataURL('image/jpeg',.82);
        window.__img[key]=url;
        const th=document.getElementById('th-'+key);
        th.classList.add('filled'); th.style.backgroundImage=`url('${url}')`; th.textContent='';
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function clearImg(key){
  window.__img[key]='';
  const th=document.getElementById('th-'+key);
  if(th){ th.classList.remove('filled'); th.style.backgroundImage=''; th.textContent='+'; }
}
function slotData(prefix,n){
  const out=[];
  for(let i=0;i<n;i++){ const v=window.__img[prefix+'-'+i]; if(v) out.push(v); }
  return out;
}

  rd.readAsDataURL(f);

/* ── Reports: date-range presets, live polling, stat cards, tenant table ── */
const REP_PRESETS = [
  ['today','Today'], ['yesterday','Yesterday'], ['week','This Week'],
  ['mtd','This Month'], ['last7','Last 7 Days'], ['last30','Last 30 Days']
];
function fmtDate(d){ return d.toISOString().slice(0,10); }
function setReportRange(preset){
  window.__repPreset = preset;
  const now = new Date();
  let from, to = now;
  if(preset==='today'){ from = new Date(now.getFullYear(),now.getMonth(),now.getDate()); }
  else if(preset==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); from=new Date(y.getFullYear(),y.getMonth(),y.getDate()); to=from; }
  else if(preset==='week'){ const d=new Date(now); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); from=new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  else if(preset==='mtd'){ from = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if(preset==='last7'){ const d=new Date(now); d.setDate(d.getDate()-6); from=new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  else if(preset==='last30'){ const d=new Date(now); d.setDate(d.getDate()-29); from=new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  document.getElementById('repFrom').value = fmtDate(from);
  document.getElementById('repTo').value = fmtDate(to);
  renderRepPresets();
}
function renderRepPresets(){
  const el=document.getElementById('repPresets'); if(!el) return;
  el.innerHTML = REP_PRESETS.map(p=>`<button class="rep-preset ${window.__repPreset===p[0]?'active':''}" onclick="setReportRange('${p[0]}');loadReport()">${p[1]}</button>`).join('')+
    `<button class="rep-preset ${window.__repPreset==='custom'?'active':''}" onclick="window.__repPreset='custom';renderRepPresets()">Custom</button>`;
}

/* self-diagnostic: is the LIVE database actually running the tenant data
   that's currently in catalog.json? This is what silently broke before —
   the DB was seeded once, ever, and later catalog.json updates had zero
   effect on the live site until this version-check + reseed path existed. */
async function checkDataSync(){
  const el = document.getElementById('dataSyncStatus');
  const k = K();
  if(!k){ el.textContent = ''; return; }
  try{
    const r = await fetch('/api/admin/data-status', {headers:{'x-admin-key':k}});
    if(!r.ok){ el.textContent=''; return; }
    const d = await r.json();
    if(d.persistent === false){
      const el2 = document.getElementById('dataSyncStatus');
      el2.innerHTML = '\u26D4 <b>DATA IS NOT BEING SAVED PERMANENTLY</b> \u2014 this server is using a temporary file store, '+
        'so ratings, vacancies and edits are lost whenever it restarts. Attach a Postgres database and set '+
        '<code>DATABASE_URL</code> in your hosting environment, then redeploy.';
      el2.style.color = '#b00020';
      return;
    }
    if(d.inSync){
      el.innerHTML = `✅ <b>Live data is up to date</b> — v${d.liveVersion}, ${d.liveTenantCount} tenants.`;
      el.style.color = '#1d9e54';
    } else {
      el.innerHTML = `⚠️ <b>Live site is running OLD data</b> — live is v${d.liveVersion===null?'none':d.liveVersion} `+
        `(${d.liveTenantCount} tenants) but catalog.json on this deploy is v${d.fileVersion} (${d.fileTenantCount} tenants). `+
        `<button onclick="forceReseed()" style="margin-left:6px;background:#c2185b;color:#fff;border:0;border-radius:6px;padding:5px 12px;font-size:.76rem;font-weight:700;cursor:pointer">Reseed live data now</button>`;
      el.style.color = '#9a6b00';
    }
  }catch(e){ el.textContent=''; }
}
async function forceReseed(){
  if(!confirm('This overwrites ALL live tenant/product data with the catalog.json bundled in this deploy. Any edits made directly on the live site since the last update will be lost. Continue?')) return;
  try{
    const d = await api('/api/admin/reseed', {method:'POST', body:{confirm:true}});
    alert(`Reseeded — now running v${d.dataVersion} with ${d.tenants} tenants.`);
    checkDataSync();
  }catch(e){ alert(e.message); }
}
</script>
</body>
